        let width, height;
        let particles = [];
        let gridOffset = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initParticles() {
            particles = [];
            const count = Math.floor(width * 0.055);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2.2 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.45,
                    speedY: -Math.random() * 0.85 - 0.25,
                    alpha: Math.random() * 0.6 + 0.2,
                    color: Math.random() > 0.45 ? '#c084fc' : '#38bdf8'
                });
            }

        function drawBackground() {
            ctx.clearRect(0, 0, width, height);

            gridOffset = (gridOffset + 0.25) % 45;
            ctx.strokeStyle = 'rgba(192, 132, 252, 0.04)';
            ctx.lineWidth = 1;

            ctx.beginPath();
            for (let x = 0; x < width; x += 45) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = gridOffset; y < height; y += 45) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            for (let p of particles) {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.y < 0) {
                    p.y = height + 10;
                    p.x = Math.random() * width;
                }
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = p.size * 3.5;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(drawBackground);
        }

        // ============ 3D ГИРОСКОП + ПАРАЛЛАКС ДЛЯ КАРТОЧКИ ============
        const hudScene = document.getElementById('hud-scene');

        let gyroX = 0, gyroY = 0;
        let initialBeta = null, initialGamma = null;

        window.addEventListener('deviceorientation', (e) => {
            if (activeMainTab !== 'scanner') return;
            if (e.beta !== null && e.gamma !== null) {
                if (initialBeta === null) {
                    initialBeta = e.beta;
                    initialGamma = e.gamma;
                }
                const deltaBeta = Math.max(-25, Math.min(25, e.beta - initialBeta));
                const deltaGamma = Math.max(-25, Math.min(25, e.gamma - initialGamma));
                gyroX = -deltaBeta * 0.35;
                gyroY = deltaGamma * 0.45;
            }
        }, { passive: true });

        function animate3DScene(now) {
            if (activeMainTab === 'scanner') {
                const t = now * 0.001;
                const cardRotX = Math.sin(t * 1.1) * 5.0 + gyroX;
                const cardRotY = Math.cos(t * 0.85) * 6.5 + gyroY;
                const cardFloatY = Math.sin(t * 1.4) * 5.0;

                hudScene.style.transform = `translateY(${cardFloatY.toFixed(2)}px) rotateX(${cardRotX.toFixed(2)}deg) rotateY(${cardRotY.toFixed(2)}deg)`;

                const camRotX = Math.sin(t * 1.6) * 12.0 - gyroX * 0.5;
                const camRotY = Math.sin(t * 1.0) * 20.0 + gyroY * 0.5;
                const camRollZ = Math.cos(t * 0.7) * 6.0;

                cameraRig.style.transform = `rotateX(${camRotX.toFixed(2)}deg) rotateY(${camRotY.toFixed(2)}deg) rotateZ(${camRollZ.toFixed(2)}deg)`;

                const glareX = 50 + Math.cos(t * 0.85) * 28.0 + gyroY * 1.5;
                const glareY = 50 - Math.sin(t * 1.1) * 28.0 - gyroX * 1.5;
                glare.style.background = `radial-gradient(circle at ${glareX.toFixed(1)}% ${glareY.toFixed(1)}%, rgba(255, 255, 255, 0.28) 0%, rgba(192, 132, 252, 0.06) 45%, transparent 75%)`;
            }
            requestAnimationFrame(animate3DScene);

        function renderFloor() {
            const data = window.MIREA_MAPS?.[currentCampus]?.[currentFloor];
            if (!data) return;

            layerAreas.innerHTML = '';
            layerLines.innerHTML = '';
            layerLabels.innerHTML = '';
            layerHighlight.innerHTML = '';

            const verts = data.v || {};
            const areas = data.a || [];
            const lines = data.l || [];

            // Расчет Bounding Box
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const [x, y] of Object.values(verts)) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }

            const pad = 300;
            currentBBox = {
                minX: minX - pad,
                maxX: maxX + pad,
                minY: minY - pad,
                maxY: maxY + pad,
                w: (maxX - minX) + pad * 2,
                h: (maxY - minY) + pad * 2
            };

            // Отрисовка полигонов аудиторий
            areas.forEach((a, idx) => {
                const pts = (a.v || []).map(vid => verts[vid]).filter(Boolean);
                if (pts.length >= 3) {
                    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    poly.setAttribute('points', pts.map(p => `${p[0]},${p[1]}`).join(' '));
                    
                    let cls = 'map-area-poly';
                    const name = a.n || '';
                    if (name.includes('Туалет')) cls += ' type-toilet';
                    else if (name.includes('Буфет') || name.includes('Столовая')) cls += ' type-food';
                    else if (name.includes('Вход')) cls += ' type-entrance';
                    
                    poly.setAttribute('class', cls);
                    poly.id = `area-${idx}`;

                    poly.onclick = (e) => {
                        e.stopPropagation();
                        showRoomDetails(a, pts);
                    };

                    layerAreas.appendChild(poly);

                    // Отрисовка адаптивных подписей с защитой от наложения
                    if (name) {
                        // Расчет габаритов полигона
                        const xs = pts.map(p => p[0]);
                        const ys = pts.map(p => p[1]);
                        const minX = Math.min(...xs), maxX = Math.max(...xs);
                        const minY = Math.min(...ys), maxY = Math.max(...ys);
                        const roomW = maxX - minX;
                        const roomH = maxY - minY;
                        const minDim = Math.min(roomW, roomH);

                        const cx = pts.reduce((sum, p) => sum + p[0], 0) / pts.length;
                        const cy = pts.reduce((sum, p) => sum + p[1], 0) / pts.length;

                        // Оптимизация текста для туалетов
                        let displayLabel = name;
                        let extraClass = '';
                        if (name.includes('Туалет')) {
                            extraClass = ' label-wc';
                            if (name.includes('МЖ')) displayLabel = 'WC 🚻';
                            else if (name.includes('Ж')) displayLabel = 'WC 🚺';
                            else if (name.includes('М')) displayLabel = 'WC 🚹';
                            else displayLabel = 'WC 🚻';
                        } else if (name.includes('Буфет') || name.includes('Столовая')) {
                            extraClass = ' label-food';
                            displayLabel = '☕ ' + name;
                        } else if (name.includes('Вход')) {
                            extraClass = ' label-entrance';
                        }

                        // Сокращение слишком длинных названий
                        if (displayLabel.length > 14 && !displayLabel.includes('WC')) {
                            displayLabel = displayLabel.substring(0, 12) + '..';
                        }

                        // Динамический расчет размера шрифта под габариты помещения
                        // При roomW = 200 шрифт уменьшается, при roomW = 800 увеличивается
                        let targetFontSize = Math.min(105, Math.max(38, Math.floor(minDim * 0.28)));
                        // Для длинного текста масштабируем под ширину комнаты
                        const estTextLen = displayLabel.length * (targetFontSize * 0.58);
                        if (estTextLen > roomW * 0.88) {
                            targetFontSize = Math.max(34, Math.floor((roomW * 0.88) / (displayLabel.length * 0.58)));
                        }

                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', cx);
                        text.setAttribute('y', cy);
                        text.setAttribute('class', 'map-label-text' + extraClass);
                        text.setAttribute('style', `font-size: ${targetFontSize}px;`);
                        text.setAttribute('data-base-size', targetFontSize);
                        text.setAttribute('data-min-dim', minDim);
                        text.textContent = displayLabel;
                        layerLabels.appendChild(text);
                    }
                }
            });

            // Отрисовка стен
            lines.forEach(([v1, v2]) => {
                const p1 = verts[v1];
                const p2 = verts[v2];
                if (p1 && p2) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', p1[0]);
                    line.setAttribute('y1', p1[1]);
                    line.setAttribute('x2', p2[0]);
                    line.setAttribute('y2', p2[1]);
                    line.setAttribute('class', 'map-wall-line');
                    layerLines.appendChild(line);
                }
            });

            resetMapView();
        }

        function resetMapView() {
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;

            const scaleX = vw / currentBBox.w;
            const scaleY = vh / currentBBox.h;
            scale = Math.min(scaleX, scaleY) * 0.92;

            tx = (vw - currentBBox.w * scale) / 2 - currentBBox.minX * scale;
            ty = (vh - currentBBox.h * scale) / 2 - currentBBox.minY * scale;

            updateTransform();
        }

        function zoomMap(factor, cx = null, cy = null) {
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;
            const focusX = cx !== null ? cx : vw / 2;
            const focusY = cy !== null ? cy : vh / 2;

            const newScale = Math.max(0.005, Math.min(2.5, scale * factor));
            tx = focusX - (focusX - tx) * (newScale / scale);
            ty = focusY - (focusY - ty) * (newScale / scale);
            scale = newScale;

            updateTransform();
        }

        function showRoomDetails(area, pts) {
            const card = document.getElementById('room-card');
            const title = document.getElementById('room-card-title');
            const sub = document.getElementById('room-card-sub');

            title.innerText = area.n || 'Аудитория без названия';
            const campusName = currentCampus === 'v78' ? 'Вернадского, 78' : 'М. Пироговская, 1';
            sub.innerText = `${campusName} · Этаж ${currentFloor}`;
            card.style.display = 'block';

            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

            // Подсветка полигона
            highlightPolygon(pts);
        }

        function highlightPolygon(pts) {
            layerHighlight.innerHTML = '';
            if (!pts || pts.length < 3) return;

            const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            poly.setAttribute('points', pts.map(p => `${p[0]},${p[1]}`).join(' '));
            poly.setAttribute('class', 'map-area-poly highlighted');
            layerHighlight.appendChild(poly);
        }

        function closeRoomCard() {
            document.getElementById('room-card').style.display = 'none';
            layerHighlight.innerHTML = '';
        }

        // ============ УПРАВЛЕНИЕ ЖЕСТАМИ (PAN & PINCH TO ZOOM) ============
        function setupMapGestures() {
            let isDragging = false;
            let lastMouseX = 0, lastMouseY = 0;
            let initialDistance = 0;
            let initialScale = 1;
            let initialTouchCenter = { x: 0, y: 0 };
            let lastTapTime = 0;

            // Мышь
            viewport.addEventListener('mousedown', (e) => {
                if (e.target.closest('.map-topbar') || e.target.closest('.floor-selector') || e.target.closest('.map-controls')) return;
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                tx += e.clientX - lastMouseX;
                ty += e.clientY - lastMouseY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                updateTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.18 : 0.85;
                zoomMap(factor, e.clientX, e.clientY);
            }, { passive: false });

            // Сенсорные экраны (Смартфоны)
            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;

                    // Двойной тап для приближения
                    const now = Date.now();
                    if (now - lastTapTime < 300) {
                        zoomMap(1.8, e.touches[0].clientX, e.touches[0].clientY);
                    }
                    lastTapTime = now;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialScale = scale;
                    initialTouchCenter = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };
                }
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) {
                    tx += e.touches[0].clientX - lastMouseX;
                    ty += e.touches[0].clientY - lastMouseY;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                    updateTransform();
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = dist / initialDistance;
                    const newScale = Math.max(0.005, Math.min(2.5, initialScale * factor));

                    tx = initialTouchCenter.x - (initialTouchCenter.x - tx) * (newScale / scale);
                    ty = initialTouchCenter.y - (initialTouchCenter.y - ty) * (newScale / scale);
                    scale = newScale;

                    updateTransform();
                }
            }, { passive: true });

            viewport.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        // ============ ПОИСК АУДИТОРИЙ ============
        function setupSearch() {
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim().toLowerCase();
                if (!query) {
                    searchDropdown.style.display = 'none';
                    return;
                }

                const campusData = window.MIREA_MAPS?.[currentCampus] || {};
                const matches = [];

                for (const [flNum, flData] of Object.entries(campusData)) {
                    const verts = flData.v || {};
                    (flData.a || []).forEach(a => {
                        const name = a.n || '';
                        if (name.toLowerCase().includes(query)) {
                            const pts = (a.v || []).map(vid => verts[vid]).filter(Boolean);
                            if (pts.length >= 3) {
                                const cx = pts.reduce((sum, p) => sum + p[0], 0) / pts.length;
                                const cy = pts.reduce((sum, p) => sum + p[1], 0) / pts.length;
                                matches.push({
                                    name,
                                    floor: flNum,
                                    cx, cy, pts, area: a
                                });
                            }
                        }
                    });
                }

                if (matches.length === 0) {
                    searchDropdown.style.display = 'none';
                    return;
                }

                searchDropdown.innerHTML = '';
                matches.slice(0, 15).forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'search-item';
                    item.innerHTML = `<span>${m.name}</span><span class="search-item-floor">Этаж ${m.floor}</span>`;
                    item.onclick = () => {
                        searchInput.value = m.name;
                        searchDropdown.style.display = 'none';
                        if (currentFloor !== m.floor) {
                            selectFloor(m.floor);
                        }
                        // Центрирование и подсветка
                        focusOnCoords(m.cx, m.cy);
                        showRoomDetails(m.area, m.pts);
                    };
                    searchDropdown.appendChild(item);
                });

                searchDropdown.style.display = 'block';
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.map-search-wrapper')) {
                    searchDropdown.style.display = 'none';
                }
            });
        }

        function focusOnCoords(targetX, targetY) {
            const vw = viewport.clientWidth || window.innerWidth;
            const vh = viewport.clientHeight || window.innerHeight;

            scale = 0.28; // Увеличенный фокусный зум для аудитории
            tx = vw / 2 - targetX * scale;
            ty = vh / 2 - targetY * scale;

            updateTransform();
        }

        window.onload = () => {
            updateUI();
        };
    </script>

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((reg) => console.log('⚡ PWA Service Worker Registered! Scope:', reg.scope))
                    .catch((err) => console.warn('SW registration failed:', err));
            });
        }
