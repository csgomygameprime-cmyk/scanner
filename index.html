<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ PULSE CYBER SCANNER</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Универсальный высокоскоростной QR-декодер для iOS / Android fallback -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        :root {
            --neon-purple: #c084fc;
            --neon-violet: #9333ea;
            --neon-pink: #f43f5e;
            --neon-cyan: #38bdf8;
            --neon-green: #22c55e;
            --bg-dark: #060212;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(147, 51, 234, 0.45) 0%, transparent 65%),
                radial-gradient(circle at 80% 90%, rgba(244, 63, 94, 0.18) 0%, transparent 50%),
                linear-gradient(rgba(147, 51, 234, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(147, 51, 234, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .ambient-glow-1 {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(124, 58, 237, 0) 70%);
            filter: blur(65px);
            z-index: 0;
            pointer-events: none;
        }

        .hud-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            background: rgba(18, 10, 36, 0.82);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 28px;
            padding: 20px 16px;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.9),
                0 0 45px rgba(147, 51, 234, 0.35),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .top-telemetry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(216, 180, 254, 0.85);
            font-family: monospace;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            margin-right: 6px;
            animation: blink 1.2s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Видоискатель сканера */
        .camera-viewport {
            position: relative;
            width: 100%;
            height: 270px;
            background: #000000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 8px 25px rgba(0,0,0,0.5);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #camera-video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform 0.08s ease-out;
        }

        #camera-canvas {
            display: none;
        }

        /* Неоновая рамка-прицел */
        .target-reticle {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 18px;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 18px rgba(192, 132, 252, 0.45), inset 0 0 18px rgba(192, 132, 252, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .target-reticle .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: inherit;
        }

        .corner-tl { top: -2px; left: -2px; border-top: 3px solid; border-left: 3px solid; }
        .corner-tr { top: -2px; right: -2px; border-top: 3px solid; border-right: 3px solid; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom: 3px solid; border-left: 3px solid; }
        .corner-br { bottom: -2px; right: -2px; border-bottom: 3px solid; border-right: 3px solid; }

        .laser-line {
            position: absolute;
            width: 92%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff, var(--neon-purple), transparent);
            box-shadow: 0 0 10px var(--neon-purple);
            animation: sweep 1.8s ease-in-out infinite alternate;
        }

        @keyframes sweep {
            0% { top: 8%; opacity: 0.3; }
            100% { top: 92%; opacity: 1; }
        }

        /* Состояние фиксации QR (зеленый лок) */
        .target-reticle.locked {
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 35px var(--neon-green), inset 0 0 25px var(--neon-green) !important;
            transform: scale(1.05);
        }

        .target-reticle.locked .laser-line {
            background: linear-gradient(90deg, transparent, #ffffff, var(--neon-green), transparent);
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Индикатор текущего зума на видео */
        .zoom-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(18, 10, 36, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.5);
            border-radius: 10px;
            padding: 4px 8px;
            font-size: 11px;
            font-family: monospace;
            font-weight: 700;
            color: #d8b4fe;
            backdrop-filter: blur(8px);
            z-index: 2;
        }

        /* Панель зума (Пресеты + Ползунок) */
        .zoom-controls-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 8px 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zoom-presets {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .zoom-btn {
            flex: 1;
            padding: 6px 0;
            font-size: 12px;
            font-weight: 800;
            font-family: monospace;
            border-radius: 10px;
            border: 1px solid rgba(192, 132, 252, 0.3);
            background: rgba(147, 51, 234, 0.15);
            color: #d8b4fe;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .zoom-btn.active {
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: #ffffff;
            border-color: #c084fc;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.6);
        }

        .zoom-slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .zoom-slider-row span {
            font-size: 11px;
            color: #a855f7;
            font-family: monospace;
            font-weight: bold;
        }

        .zoom-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 5px;
            background: rgba(168, 85, 247, 0.3);
            outline: none;
        }

        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #c084fc;
            cursor: pointer;
            box-shadow: 0 0 8px #9333ea;
        }

        /* Переключатель режимов */
        .mode-toggle-container {
            display: flex;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 3px;
            margin-bottom: 10px;
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 8px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #d8b4fe;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(147, 51, 234, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }

        .status-msg {
            font-size: 12px;
            color: #d8b4fe;
            opacity: 0.85;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>

    <div class="hud-card">
        <div class="top-telemetry">
            <div><span class="status-dot"></span>SYS_ACTIVE</div>
            <div id="target-display">TARGET: ALL</div>
        </div>

        <!-- Видоискатель с прицелом -->
        <div class="camera-viewport" id="viewport">
            <video id="camera-video" playsinline muted autoplay></video>
            <canvas id="camera-canvas"></canvas>

            <div class="target-reticle" id="reticle">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                <div class="laser-line"></div>
            </div>

            <div class="zoom-badge" id="zoom-badge">1.0x</div>
        </div>

        <!-- Панель управления зумом (Пинч / Пресеты / Слайдер) -->
        <div class="zoom-controls-panel">
            <div class="zoom-presets">
                <button class="zoom-btn active" onclick="applyZoom(1.0)">1x</button>
                <button class="zoom-btn" onclick="applyZoom(2.0)">2x</button>
                <button class="zoom-btn" onclick="applyZoom(3.0)">3x</button>
                <button class="zoom-btn" onclick="applyZoom(4.5)">4.5x</button>
            </div>
            <div class="zoom-slider-row">
                <span>1x</span>
                <input type="range" id="zoom-slider" class="zoom-slider" min="1.0" max="5.0" step="0.1" value="1.0">
                <span>5x</span>
            </div>
        </div>

        <!-- Селектор: Все vs Моя группа -->
        <div class="mode-toggle-container">
            <button class="toggle-btn active" id="btn-all" onclick="selectMode('ALL')">
                ⚡ Все
            </button>
            <button class="toggle-btn" id="btn-my" onclick="selectMode('MY_GROUP')">
                👥 Моя группа
            </button>
        </div>

        <div class="status-msg" id="status-msg">Наведите прицел на QR-код</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentMode = localStorage.getItem('qr_target_mode') || 'ALL';
        let videoTrack = null;
        let trackCapabilities = null;
        let currentZoom = 1.0;
        let isScanned = false;
        let scanTimer = null;

        const videoEl = document.getElementById('camera-video');
        const canvasEl = document.getElementById('camera-canvas');
        const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
        const reticleEl = document.getElementById('reticle');
        const zoomBadgeEl = document.getElementById('zoom-badge');
        const zoomSlider = document.getElementById('zoom-slider');
        const statusMsg = document.getElementById('status-msg');
        const viewport = document.getElementById('viewport');

        // Синтезированный аудио-бип при захвате цели
        function playBeep(freq = 1200, duration = 0.08) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function updateModeUI() {
            const display = document.getElementById('target-display');
            const btnAll = document.getElementById('btn-all');
            const btnMy = document.getElementById('btn-my');

            if (currentMode === 'MY_GROUP') {
                display.innerText = 'TARGET: MY GROUP';
                btnAll.classList.remove('active');
                btnMy.classList.add('active');
            } else {
                display.innerText = 'TARGET: ALL';
                btnMy.classList.remove('active');
                btnAll.classList.add('active');
            }
        }

        function selectMode(mode) {
            currentMode = mode;
            localStorage.setItem('qr_target_mode', mode);
            playBeep(880, 0.05);
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
            updateModeUI();
        }

        // ============ ИНИЦИАЛИЗАЦИЯ КАМЕРЫ И ЗУМА ============

        async function initCamera() {
            try {
                const constraints = {
                    audio: false,
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];

                if (videoTrack) {
                    trackCapabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
                    if (trackCapabilities.zoom) {
                        zoomSlider.min = trackCapabilities.zoom.min || 1.0;
                        zoomSlider.max = Math.min(trackCapabilities.zoom.max || 5.0, 8.0);
                        zoomSlider.step = trackCapabilities.zoom.step || 0.1;
                    }
                }

                videoEl.onloadedmetadata = () => {
                    videoEl.play();
                    startScanningLoop();
                };
            } catch (err) {
                statusMsg.innerText = "Ошибка доступа к камере";
                console.error("Camera init error:", err);
            }
        }

        async function applyZoom(val) {
            val = Math.max(parseFloat(zoomSlider.min), Math.min(parseFloat(zoomSlider.max), val));
            currentZoom = val;
            zoomBadgeEl.innerText = `${val.toFixed(1)}x`;
            zoomSlider.value = val;

            // Обновляем активный класс на кнопках пресетов
            document.querySelectorAll('.zoom-btn').forEach(btn => {
                const btnVal = parseFloat(btn.innerText.replace('x', ''));
                btn.classList.toggle('active', Math.abs(btnVal - val) < 0.25);
            });

            // 1. Аппаратный зум сенсора (Android / Новые устройства)
            if (videoTrack && trackCapabilities?.zoom) {
                try {
                    await videoTrack.applyConstraints({
                        advanced: [{ zoom: val }]
                    });
                    videoEl.style.transform = 'scale(1)';
                    return;
                } catch(e) {
                    console.warn("Hardware zoom unsupported:", e);
                }
            }

            // 2. Высококачественный цифровой зум (iOS Safari / WebKit fallback)
            videoEl.style.transform = `scale(${val})`;
        }

        // ============ ОБРАБОТЧИК ЖЕСТА ЩИПКА (PINCH-TO-ZOOM) ============

        let startTouchDistance = 0;
        let startZoomOnTouch = 1.0;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                startTouchDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                startZoomOnTouch = currentZoom;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && startTouchDistance > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const factor = currentDist / startTouchDistance;
                applyZoom(startZoomOnTouch * factor);
            }
        }, { passive: true });

        zoomSlider.addEventListener('input', (e) => {
            applyZoom(parseFloat(e.target.value));
        });

        // ============ ЦИКЛ РАСПОЗНАВАНИЯ И ФИКСАЦИИ ЦЕЛИ ============

        async function startScanningLoop() {
            let barcodeDetector = null;
            if ('BarcodeDetector' in window) {
                try {
                    barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
                } catch(e) {}
            }

            const scanFrame = async () => {
                if (isScanned || !videoEl.videoWidth) {
                    if (!isScanned) requestAnimationFrame(scanFrame);
                    return;
                }

                let detectedCode = null;

                // Быстрый аппаратный BarcodeDetector
                if (barcodeDetector) {
                    try {
                        const barcodes = await barcodeDetector.detect(videoEl);
                        if (barcodes.length > 0) {
                            detectedCode = barcodes[0].rawValue;
                        }
                    } catch(e) {}
                }

                // Фоллбэк через jsQR при цифровом зуме
                if (!detectedCode) {
                    canvasEl.width = videoEl.videoWidth;
                    canvasEl.height = videoEl.videoHeight;
                    ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

                    // Считывание центральной зоны с учетом зума
                    const cropSize = Math.min(canvasEl.width, canvasEl.height) * 0.75;
                    const cropX = (canvasEl.width - cropSize) / 2;
                    const cropY = (canvasEl.height - cropSize) / 2;
                    const imageData = ctx.getImageData(cropX, cropY, cropSize, cropSize);

                    if (window.jsQR) {
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: "dontInvert"
                        });
                        if (code && code.data) {
                            detectedCode = code.data;
                        }
                    }
                }

                if (detectedCode && !isScanned) {
                    handleSuccessfulCapture(detectedCode);
                    return;
                }

                requestAnimationFrame(scanFrame);
            };

            requestAnimationFrame(scanFrame);
        }

        function handleSuccessfulCapture(qrText) {
            isScanned = true;

            // Захват цели: смена цвета рамки на ярко-зеленый + виброотклик
            reticleEl.classList.add('locked');
            statusMsg.innerText = "⚡ QR-КОД ЗАХВАЧЕН!";
            statusMsg.style.color = "#4ade80";

            playBeep(1760, 0.12);

            if (tg?.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            const payload = JSON.stringify({
                url: qrText.trim(),
                group: currentMode
            });

            setTimeout(() => {
                if (tg?.sendData) {
                    tg.sendData(payload);
                    tg.close();
                } else {
                    alert(`Отсканировано: ${qrText} [${currentMode}]`);
                }
            }, 250);
        }

        window.onload = () => {
            updateModeUI();
            initCamera();
        };
    </script>
</body>
</html>
