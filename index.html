<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ PULSE CYBER SCANNER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --neon-purple: #c084fc;
            --neon-violet: #9333ea;
            --neon-pink: #f43f5e;
            --neon-cyan: #38bdf8;
            --bg-dark: #060212;
            --card-bg: rgba(18, 10, 36, 0.85);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(147, 51, 234, 0.45) 0%, transparent 65%),
                radial-gradient(circle at 80% 90%, rgba(244, 63, 94, 0.18) 0%, transparent 50%),
                linear-gradient(rgba(147, 51, 234, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(147, 51, 234, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 16px 85px 16px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow-1 {
            position: fixed;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(124, 58, 237, 0) 70%);
            filter: blur(65px);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -50px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(147, 51, 234, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
        }

        .hud-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 28px;
            padding: 24px 20px;
            backdrop-filter: blur(35px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 45px rgba(147, 51, 234, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--neon-purple);
            pointer-events: none;
        }
        .corner-tl { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; }

        .top-telemetry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(216, 180, 254, 0.85);
            font-family: monospace;
            margin-bottom: 12px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            margin-right: 6px;
        }

        .tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        .hero-3d-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 4px 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-3d-cube {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(99, 102, 241, 0.15) 100%);
            border: 1px solid rgba(216, 180, 254, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 15px 35px rgba(124, 58, 237, 0.45);
        }

        h1 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 11.5px;
            color: #d8b4fe;
            opacity: 0.85;
            margin-bottom: 12px;
        }

        .mode-toggle-container {
            display: flex;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 16px;
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 8px;
            font-size: 12.5px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #d8b4fe;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(147, 51, 234, 0.5);
        }

        .cyber-btn {
            position: relative;
            width: 100%;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.55);
        }

        .cyber-input-group {
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
        }

        .cyber-label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d8b4fe;
            margin-bottom: 3px;
            display: block;
        }

        .cyber-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 13.5px;
            color: #ffffff;
            outline: none;
        }

        .acc-list {
            width: 100%;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .acc-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        .acc-info-email {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            word-break: break-all;
        }

        .acc-info-sub {
            font-size: 10px;
            color: #d8b4fe;
            opacity: 0.8;
        }

        .btn-del {
            background: rgba(244, 63, 94, 0.18);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fda4af;
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 380px;
            background: rgba(18, 10, 36, 0.9);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 22px;
            padding: 6px;
            backdrop-filter: blur(25px);
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 16px;
            cursor: pointer;
            color: #d8b4fe;
            font-size: 11px;
            font-weight: 600;
            gap: 3px;
        }

        .nav-item.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.4) 0%, rgba(99, 102, 241, 0.25) 100%);
            border: 1px solid rgba(192, 132, 252, 0.3);
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="hud-card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="top-telemetry">
            <div><span class="status-dot"></span>SYS_READY</div>
            <div id="target-display">TARGET: ALL</div>
        </div>

        <!-- ВКЛАДКА 1: СКАНЕР -->
        <div class="tab-content active" id="tab-scan">
            <div class="hero-3d-wrapper">
                <div class="hero-3d-cube"><span>📸</span></div>
            </div>
            <h1>Fast QR Scanner</h1>
            <p class="subtitle">Параллельный залп по сокетам (&lt;0.1s)</p>

            <div class="mode-toggle-container">
                <button class="toggle-btn active" id="btn-all" onclick="selectTargetMode('ALL')">⚡ Все</button>
                <button class="toggle-btn" id="btn-my" onclick="selectTargetMode('MY_GROUP')">👥 Моя группа</button>
            </div>

            <button class="cyber-btn" onclick="startScanner()">
                <span>⚡ Сканировать QR</span>
            </button>
        </div>

        <!-- ВКЛАДКА 2: УПРАВЛЕНИЕ -->
        <div class="tab-content" id="tab-manage">
            <h1 style="margin-top: 4px;">Управление</h1>
            <p class="subtitle">Добавление и ваши аккаунты</p>

            <div id="add-account-form" style="width: 100%;">
                <div class="cyber-input-group">
                    <label class="cyber-label">Почта (edu.mirea.ru)</label>
                    <input type="email" id="input-email" class="cyber-input" placeholder="ivanov.i@edu.mirea.ru">
                </div>
                <div class="cyber-input-group">
                    <label class="cyber-label">Пароль</label>
                    <input type="password" id="input-pass" class="cyber-input" placeholder="••••••••••••">
                </div>
                <button class="cyber-btn" style="margin-bottom: 10px;" onclick="submitNewAccount()">
                    <span>🔑 Войти аккаунт</span>
                </button>
            </div>

            <div id="code-verify-form" style="width: 100%; display: none;">
                <div class="cyber-input-group">
                    <label class="cyber-label" style="color: #38bdf8;">✉️ Введите код из письма</label>
                    <input type="text" id="input-code" class="cyber-input" placeholder="6-значный код">
                </div>
                <button class="cyber-btn" style="background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); margin-bottom: 10px;" onclick="submitAuthCode()">
                    <span>✅ Подтвердить код</span>
                </button>
            </div>

            <div class="top-telemetry" style="margin-top: 4px; margin-bottom: 2px;">
                <div>МОИ АККАУНТЫ</div>
                <div id="my-acc-count">0 шт.</div>
            </div>

            <div class="acc-list" id="my-accounts-list"></div>
        </div>

        <!-- ВКЛАДКА 3: ВСЕ АККАУНТЫ -->
        <div class="tab-content" id="tab-all-accs">
            <h1 style="margin-top: 4px;">Все аккаунты</h1>
            <p class="subtitle">База данных системы</p>

            <div class="top-telemetry" style="margin-bottom: 2px;">
                <div>ВСЕГО В СИСТЕМЕ</div>
                <div id="all-acc-count">0 шт.</div>
            </div>

            <div class="acc-list" id="all-accounts-list"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('tab-scan', this)"><span style="font-size:16px">⚡</span><span>Сканер</span></div>
        <div class="nav-item" onclick="switchTab('tab-manage', this)"><span style="font-size:16px">➕</span><span>Управление</span></div>
        <div class="nav-item" onclick="switchTab('tab-all-accs', this)"><span style="font-size:16px">👥</span><span>Все аккаунты</span></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const ADMIN_ID = 1828262091;
        const currentUserId = tg?.initDataUnsafe?.user?.id || ADMIN_ID;
        let currentTargetMode = localStorage.getItem('qr_target_mode') || 'ALL';

        function playSciFiBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function switchTab(tabId, el) {
            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function selectTargetMode(mode) {
            currentTargetMode = mode;
            localStorage.setItem('qr_target_mode', mode);
            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            updateTargetUI();
        }

        function updateTargetUI() {
            const display = document.getElementById('target-display');
            const btnAll = document.getElementById('btn-all');
            const btnMy = document.getElementById('btn-my');
            if (currentTargetMode === 'MY_GROUP') {
                display.innerText = 'TARGET: MY GROUP';
                btnAll.classList.remove('active');
                btnMy.classList.add('active');
            } else {
                display.innerText = 'TARGET: ALL';
                btnMy.classList.remove('active');
                btnAll.classList.add('active');
            }
        }

        function startScanner() {
            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            if (tg?.showScanQrPopup) {
                tg.showScanQrPopup({ text: `⚡ Сканирование QR` }, function(text) {
                    if (text) {
                        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        tg.sendData(JSON.stringify({ action: "scan_qr", url: text.trim(), group: currentTargetMode }));
                        tg.close();
                        return true;
                    }
                });
            } else {
                alert("Сканер доступен через мобильное приложение Telegram");
            }
        }

        function submitNewAccount() {
            const email = document.getElementById('input-email').value.trim();
            const pass = document.getElementById('input-pass').value.trim();
            if (!email || !pass) { alert("Заполните почту и пароль!"); return; }

            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            tg.sendData(JSON.stringify({ action: "start_login", email: email, password: pass }));
        }

        function submitAuthCode() {
            const code = document.getElementById('input-code').value.trim();
            if (!code) { alert("Введите код из письма!"); return; }
            tg.sendData(JSON.stringify({ action: "submit_code", code: code }));
        }

        function deleteAccount(email) {
            if (!confirm(`Удалить аккаунт ${email}?`)) return;
            tg.sendData(JSON.stringify({ action: "delete_account", email: email }));
        }

        function renderAccounts(accountsData) {
            const myContainer = document.getElementById('my-accounts-list');
            const allContainer = document.getElementById('all-accounts-list');
            myContainer.innerHTML = '';
            allContainer.innerHTML = '';

            let myCount = 0;
            let allCount = 0;

            for (const [email, data] of Object.entries(accountsData)) {
                allCount++;
                const ownerId = data.owner_id || ADMIN_ID;
                const group = data.group || 'Общая';

                const allItem = document.createElement('div');
                allItem.className = 'acc-item';
                allItem.innerHTML = `<div><div class="acc-info-email">${email}</div><div class="acc-info-sub">Группа: ${group}</div></div>`;
                allContainer.appendChild(allItem);

                if (ownerId === currentUserId || currentUserId === ADMIN_ID) {
                    myCount++;
                    const myItem = document.createElement('div');
                    myItem.className = 'acc-item';
                    myItem.innerHTML = `<div><div class="acc-info-email">${email}</div><div class="acc-info-sub">[${group}]</div></div><button class="btn-del" onclick="deleteAccount('${email}')">Удалить</button>`;
                    myContainer.appendChild(myItem);
                }
            }

            document.getElementById('my-acc-count').innerText = `${myCount} шт.`;
            document.getElementById('all-acc-count').innerText = `${allCount} шт.`;
        }

        window.onload = () => {
            updateTargetUI();
            if (tg) {
                try {
                    tg.sendData(JSON.stringify({ action: "get_accounts" }));
                } catch(e) {}
            }
        };
    </script>
</body>
</html>
