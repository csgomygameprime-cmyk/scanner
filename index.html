<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ PULSE CYBER SCANNER & MAPS</title>
    <!-- PWA & Offline Cache -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0b14">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Автономная векторная база карт МИРЭА (В-78 и МП-1) -->
    <script src="maps_data.js"></script>
    <!-- Автономная база расписания групп -->
    <script src="schedule_data.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --neon-purple: #c084fc;
            --neon-violet: #9333ea;
            --neon-pink: #f43f5e;
            --neon-cyan: #38bdf8;
            --neon-green: #22c55e;
            --bg-dark: #060212;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            perspective: 1100px;
        }

        /* 60 FPS Фоновый Canvas (Сетка + Частицы) */
        #cyber-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Неоновые светящиеся сферы */
        .ambient-glow-1 {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(124, 58, 237, 0) 70%);
            filter: blur(65px);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow 5s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -50px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(147, 51, 234, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.5; }
            100% { transform: scale(1.15) translate(15px, 15px); opacity: 0.85; }
        }

        /* 3D Сцена Сканера */
        .hud-scene {
            width: 100%;
            max-width: 350px;
            z-index: 10;
            transform-style: preserve-3d;
            will-change: transform;
            margin-bottom: 50px;
        }

        /* Главная голографическая карточка */
        .hud-card {
            position: relative;
            width: 100%;
            background: rgba(18, 10, 36, 0.78);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 30px;
            padding: 26px 20px;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.85),
                0 0 40px rgba(147, 51, 234, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform-style: preserve-3d;
            overflow: hidden;
        }

        .card-specular-glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 30px;
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 2;
        }

        .corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--neon-cyan);
            border-style: solid;
            pointer-events: none;
            opacity: 0.8;
        }
        .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
        .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

        .top-telemetry {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: var(--neon-green);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 10px var(--neon-green);
            animation: blink 2s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        .camera-3d-rig {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 6px auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .rig-ring-outer {
            position: absolute;
            width: 116px;
            height: 116px;
            border: 1px dashed rgba(192, 132, 252, 0.45);
            border-radius: 50%;
            animation: spinRigOuter 24s linear infinite;
        }

        .rig-ring-inner {
            position: absolute;
            width: 96px;
            height: 96px;
            border: 2px solid transparent;
            border-top: 2px solid var(--neon-cyan);
            border-bottom: 2px solid var(--neon-pink);
            border-radius: 50%;
            animation: spinRigInner 7s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        @keyframes spinRigOuter { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinRigInner { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        .rig-body-cube {
            width: 74px;
            height: 74px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.4), rgba(56, 189, 248, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 0 25px rgba(147, 51, 234, 0.6),
                inset 0 0 15px rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transform: translateZ(25px);
        }

        .rig-lens-barrel {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #0b021d 40%, #1e0840 90%);
            border: 2px solid var(--neon-purple);
            box-shadow: 
                0 0 15px var(--neon-purple),
                inset 0 0 8px #00ffff;
            position: absolute;
            transform: translateZ(12px);
        }

        .rig-icon {
            font-size: 24px;
            z-index: 3;
            transform: translateZ(20px);
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }

        .laser-beam-3d {
            position: absolute;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, #ffffff, #00ffff, transparent);
            box-shadow: 0 0 12px #00ffff, 0 0 20px #00ffff;
            animation: laserScan 2.6s ease-in-out infinite;
            z-index: 4;
            transform: translateZ(16px);
        }

        @keyframes laserScan {
            0% { transform: translateY(-30px) translateZ(16px); opacity: 0.2; }
            50% { opacity: 1; }
            100% { transform: translateY(30px) translateZ(16px); opacity: 0.2; }
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 18px;
        }

        .mode-toggle-container {
            display: flex;
            width: 100%;
            background: rgba(10, 4, 22, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 18px;
            padding: 4px;
            margin-bottom: 18px;
        }

        .toggle-btn {
            flex: 1;
            padding: 9px 0;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12.5px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.8), rgba(192, 132, 252, 0.4));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .cyber-btn {
            position: relative;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #9333ea 0%, #c084fc 100%);
            border: none;
            border-radius: 18px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.5);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .cyber-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.7);
        }

        .cyber-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* ============ НАВИГАЦИОННЫЙ ТАБ-БАР ============ */
        .bottom-nav-container {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 94vw;
        }

        .nav-arrow-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(18, 10, 36, 0.9);
            border: 1px solid rgba(192, 132, 252, 0.35);
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-arrow-btn:active {
            transform: scale(0.9);
            border-color: var(--neon-cyan);
            color: #ffffff;
        }

        .bottom-nav {
            display: flex;
            gap: 8px;
            background: rgba(18, 10, 36, 0.92);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 26px;
            padding: 5px 6px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(147, 51, 234, 0.3);
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            width: 260px;
        }

        .bottom-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 122px;
            min-width: 122px;
            max-width: 122px;
            padding: 8px 10px;
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            flex-shrink: 0;
            scroll-snap-align: start;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.65), rgba(192, 132, 252, 0.3));
            border-color: rgba(192, 132, 252, 0.6);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.45);
        }

        .nav-tab .nav-icon {
            font-size: 16px;
        }

        /* ============ МОДУЛЬ АВТОНОМНОЙ КАРТЫ ============ */
        #map-view-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow: hidden;
            background-color: #060212;
            touch-action: none;
        }

        .map-topbar {
            position: absolute;
            top: 10px;
            left: 12px;
            right: 12px;
            z-index: 120;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .campus-picker {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .campus-btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(192, 132, 252, 0.3);
            background: rgba(18, 10, 36, 0.85);
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            font-size: 13px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            -webkit-tap-highlight-color: transparent;
        }

        .campus-btn.active {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.75), rgba(192, 132, 252, 0.35));
            border-color: rgba(192, 132, 252, 0.7);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.45);
        }

        .map-search-wrapper {
            position: relative;
            width: 100%;
            pointer-events: auto;
        }

        #map-search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid rgba(192, 132, 252, 0.3);
            background: rgba(18, 10, 36, 0.85);
            color: #ffffff;
            font-size: 13px;
            outline: none;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            font-family: inherit;
        }

        #map-search-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
        }

        .map-search-dropdown {
            position: absolute;
            top: 44px;
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            background: rgba(18, 10, 36, 0.95);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 16px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            display: none;
            z-index: 150;
        }

        .search-item {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(192, 132, 252, 0.15);
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item:active, .search-item:hover {
            background: rgba(147, 51, 234, 0.3);
            color: var(--neon-cyan);
        }

        .search-item-floor {
            font-size: 11px;
            color: var(--neon-purple);
            font-weight: 600;
        }

        #map-viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }

        #map-viewport:active {
            cursor: grabbing;
        }

        #map-svg {
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
            -webkit-user-select: none;
        }

        .floor-selector {
            position: absolute;
            top: 125px;
            right: 12px;
            z-index: 120;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(18, 10, 36, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 20px;
            padding: 6px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .floor-btn {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .floor-btn.active {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(192, 132, 252, 0.7);
        }

        .map-controls {
            position: absolute;
            bottom: 106px;
            right: 12px;
            z-index: 120;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ctrl-btn {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            border: 1px solid rgba(192, 132, 252, 0.35);
            background: rgba(18, 10, 36, 0.85);
            color: #ffffff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
        }

        .room-info-card {
            position: absolute;
            bottom: 110px;
            left: 12px;
            max-width: calc(100vw - 80px);
            background: rgba(18, 10, 36, 0.92);
            border: 1px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 12px 18px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.3);
            z-index: 125;
            display: none;
            animation: slideUpCard 0.25s ease-out;
        }

        @keyframes slideUpCard {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .room-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        #room-card-title {
            font-weight: 800;
            font-size: 16px;
            color: #ffffff;
        }

        .room-card-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .room-card-sub {
            font-size: 12px;
            color: var(--neon-purple);
            margin-top: 4px;
            font-weight: 600;
        }

        /* Элементы SVG карты */
        .map-area-poly {
            fill: rgba(30, 16, 60, 0.78);
            stroke: rgba(192, 132, 252, 0.32);
            stroke-width: 8;
            cursor: pointer;
            transition: fill 0.15s, stroke 0.15s;
        }

        .map-area-poly:hover, .map-area-poly:active {
            fill: rgba(147, 51, 234, 0.45);
            stroke: var(--neon-cyan);
            stroke-width: 14;
        }

        .map-area-poly.highlighted {
            fill: rgba(56, 189, 248, 0.55) !important;
            stroke: #38bdf8 !important;
            stroke-width: 20 !important;
            animation: neonPulse 1.2s infinite alternate;
        }

        @keyframes neonPulse {
            from { stroke-width: 14; filter: drop-shadow(0 0 8px #38bdf8); }
            to { stroke-width: 26; filter: drop-shadow(0 0 25px #38bdf8); }
        }

        .map-area-poly.type-toilet {
            fill: rgba(56, 189, 248, 0.18);
            stroke: rgba(56, 189, 248, 0.4);
        }

        .map-area-poly.type-food {
            fill: rgba(245, 158, 11, 0.22);
            stroke: rgba(245, 158, 11, 0.45);
        }

        .map-area-poly.type-entrance {
            fill: rgba(34, 197, 94, 0.22);
            stroke: rgba(34, 197, 94, 0.45);
        }

        .map-wall-line {
            stroke: rgba(255, 255, 255, 0.48);
            stroke-width: 14;
            stroke-linecap: round;
            pointer-events: none;
        }

        .map-label-text {
            fill: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            paint-order: stroke fill;
            stroke: #060212;
            stroke-width: 14px;
            stroke-linejoin: round;
        }
        .map-label-text.label-wc {
            fill: var(--neon-cyan);
            font-weight: 800;
        }
        .map-label-text.label-food {
            fill: #fbbf24;
            font-weight: 800;
        }
        .map-label-text.label-entrance {
            fill: #4ade80;
            font-weight: 800;
        }
    
        /* ============ МОДУЛЬ РАСПИСАНИЯ ============ */
        #schedule-view-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: none;
            flex-direction: column;
            background-color: #060212;
            overflow: hidden;
            box-sizing: border-box;
        }

        .sched-topbar {
            padding: 14px 16px 10px;
            background: rgba(18, 10, 36, 0.9);
            border-bottom: 1px solid rgba(192, 132, 252, 0.25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .sched-group-picker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .group-selector-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            padding: 10px 16px;
            border-radius: 18px;
            border: 1px solid rgba(192, 132, 252, 0.4);
            background: linear-gradient(135deg, rgba(28, 14, 52, 0.85) 0%, rgba(18, 10, 36, 0.95) 100%);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(168, 85, 247, 0.15);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .group-selector-btn:active {
            transform: scale(0.98);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
        }

        .group-selector-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-selector-icon {
            font-size: 16px;
            filter: drop-shadow(0 0 6px var(--neon-purple));
        }

        .group-selector-name {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .group-selector-arrow {
            font-size: 11px;
            color: rgba(192, 132, 252, 0.7);
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid rgba(192, 132, 252, 0.25);
            transition: transform 0.25s ease;
        }

        /* Модальное окно выбора группы */
        .group-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 1, 10, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .group-modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .group-modal-sheet {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 10, 36, 0.98);
            border: 1px solid var(--neon-purple);
            border-bottom: none;
            border-radius: 26px 26px 0 0;
            box-shadow: 0 -10px 40px rgba(168, 85, 247, 0.4), inset 0 0 20px rgba(168, 85, 247, 0.15);
            padding: 18px 20px 45px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .group-modal-backdrop.open .group-modal-sheet {
            transform: translateY(0);
        }

        .group-modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(192, 132, 252, 0.4);
            border-radius: 2px;
            margin: 0 auto 4px;
        }

        .group-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-modal-title {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(192, 132, 252, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .group-modal-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .group-modal-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 18px;
            border-radius: 16px;
            border: 1px solid rgba(192, 132, 252, 0.25);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.85);
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .group-modal-item:active {
            transform: scale(0.98);
        }

        .group-modal-item.active {
            border-color: var(--neon-cyan);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.18) 0%, rgba(168, 85, 247, 0.22) 100%);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
        }

        .group-modal-item-check {
            font-size: 16px;
            color: var(--neon-cyan);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .group-modal-item.active .group-modal-item-check {
            opacity: 1;
        }

        .sched-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .week-stepper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 4, 22, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 16px;
            padding: 4px 6px;
        }

        .week-step-btn {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .week-step-btn:active {
            background: var(--neon-cyan);
            color: #000;
            transform: scale(0.92);
        }

        .sched-week-title {
            font-size: 12.5px;
            font-weight: 800;
            color: #ffffff;
            padding: 0 4px;
            letter-spacing: 0.3px;
        }

        .btn-today-reset {
            padding: 5px 12px;
            border-radius: 12px;
            border: 1px solid var(--neon-cyan);
            background: rgba(56, 189, 248, 0.15);
            color: var(--neon-cyan);
            font-size: 11.5px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-today-reset:active {
            transform: scale(0.92);
            background: var(--neon-cyan);
            color: #000;
        }

        /* Кнопка журнала группы в карточке пары */
        .journal-tag-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid rgba(192, 132, 252, 0.4);
            background: rgba(147, 51, 234, 0.15);
            color: rgba(255, 255, 255, 0.85);
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .journal-tag-btn:active {
            background: rgba(147, 51, 234, 0.45);
            border-color: var(--neon-purple);
            transform: scale(0.94);
        }

        .days-bar {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            width: 100%;
        }

        .day-tab {
            flex: 1;
            padding: 7px 0 6px;
            text-align: center;
            border-radius: 14px;
            border: 1px solid rgba(192, 132, 252, 0.15);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            position: relative;
        }

        .day-tab-name {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-tab-num {
            font-size: 13.5px;
            font-weight: 800;
            color: #ffffff;
        }

        .day-tab.active {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.45), rgba(56, 189, 248, 0.25));
            border-color: var(--neon-cyan);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
        }

        .day-tab.active .day-tab-name {
            color: var(--neon-cyan);
        }

        /* Синяя неоновая точка под сегодняшним днем (как на Пульсе) */
        .day-today-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--neon-cyan);
            box-shadow: 0 0 6px var(--neon-cyan);
            margin-top: -1px;
        }

        .sched-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 110px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        /* Карточка пары (в стиле официального скрина) */
        .lesson-card {
            position: relative;
            background: rgba(20, 10, 40, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s, border-color 0.2s;
        }

        .lesson-card:active {
            transform: scale(0.985);
            border-color: var(--neon-cyan);
        }

        .lesson-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lesson-num-time {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--neon-purple);
        }

        .lesson-badge {
            padding: 3px 9px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-lk { background: rgba(56, 189, 248, 0.2); color: var(--neon-cyan); border: 1px solid rgba(56, 189, 248, 0.4); }
        .badge-pr { background: rgba(168, 85, 247, 0.2); color: var(--neon-purple); border: 1px solid rgba(168, 85, 247, 0.4); }
        .badge-lab { background: rgba(244, 63, 94, 0.2); color: var(--neon-pink); border: 1px solid rgba(244, 63, 94, 0.4); }
        .badge-sr { background: rgba(34, 197, 94, 0.2); color: var(--neon-green); border: 1px solid rgba(34, 197, 94, 0.4); }

        .lesson-title {
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.35;
            color: #ffffff;
        }

        .lesson-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 6px;
            border-top: 1px solid rgba(192, 132, 252, 0.15);
            gap: 10px;
        }

        .lesson-teacher {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 8px;
            max-width: 48%;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .lesson-teacher:active {
            background: rgba(192, 132, 252, 0.25);
            transform: scale(0.96);
            border-color: var(--neon-purple);
        }

        /* Кибер-плашка полного ФИО преподавателя (Toast) */
        .teacher-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px) scale(0.95);
            background: rgba(18, 10, 36, 0.95);
            border: 1px solid var(--neon-purple);
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 18px;
            border-radius: 16px;
            z-index: 99999;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 90vw;
            width: max-content;
            pointer-events: none;
            opacity: 0;
            transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .teacher-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .teacher-toast-icon {
            font-size: 22px;
            filter: drop-shadow(0 0 8px var(--neon-purple));
        }

        .teacher-toast-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
        }

        .teacher-toast-title {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(192, 132, 252, 0.85);
            font-weight: 800;
        }

        .teacher-toast-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        /* Кнопка кабинета с интерактивным переходом */
        .room-tag-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid var(--neon-cyan);
            background: rgba(56, 189, 248, 0.12);
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .room-tag-btn:active {
            background: rgba(56, 189, 248, 0.35);
            transform: scale(0.95);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
        }

        .room-tag-btn .room-icon {
            font-size: 11px;
            color: var(--neon-cyan);
        }

        
        /* Разделитель перерыва между парами */
        .lesson-break-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 2px 0;
            padding: 4px 10px;
        }

        .lesson-break-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.25), transparent);
        }

        .lesson-break-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(18, 10, 36, 0.65);
            border: 1px dashed rgba(192, 132, 252, 0.35);
            color: rgba(255, 255, 255, 0.55);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .lesson-break-badge.break-long {
            border-color: rgba(56, 189, 248, 0.45);
            color: var(--neon-cyan);
            background: rgba(56, 189, 248, 0.08);
        }

        
        /* Подсветка текущей активной пары прямо сейчас */
        .lesson-card.is-current-now {
            border: 1.5px solid var(--neon-cyan) !important;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.45), inset 0 0 15px rgba(56, 189, 248, 0.12) !important;
            background: linear-gradient(135deg, rgba(28, 16, 56, 0.95), rgba(18, 30, 60, 0.9)) !important;
            animation: currentLessonPulse 2.4s infinite alternate ease-in-out;
        }

        @keyframes currentLessonPulse {
            from { border-color: rgba(56, 189, 248, 0.7); box-shadow: 0 0 15px rgba(56, 189, 248, 0.35); }
            to { border-color: #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.65), inset 0 0 15px rgba(56, 189, 248, 0.2); }
        }

        .current-live-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--neon-green);
            color: #ffffff;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: blink 1.2s infinite ease-in-out;
        }

        /* Подсветка текущего перерыва прямо сейчас */
        .lesson-break-badge.is-current-break {
            border: 1.5px solid var(--neon-green) !important;
            color: #ffffff !important;
            background: rgba(34, 197, 94, 0.18) !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5) !important;
            animation: breakGlow 1.8s infinite alternate ease-in-out;
        }

        @keyframes breakGlow {
            from { box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
            to { box-shadow: 0 0 25px rgba(34, 197, 94, 0.75); }
        }

        .empty-sched-msg {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 600;
        }

    
        /* ============ МОДУЛЬ СТАТУСА И СКУД ============ */
        #status-view-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background-color: var(--bg-dark);
            overflow-y: auto;
        }

        .status-icon-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.3), transparent 70%);
            border: 2px dashed rgba(56, 189, 248, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            animation: spinRigOuter 20s linear infinite;
        }

    </style>
</head>
<body>
    <!-- 60 FPS Фоновый Canvas -->
    <canvas id="cyber-canvas"></canvas>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Вкладка 1: СКАНЕР -->
    <div class="hud-scene" id="hud-scene">
        <div class="hud-card" id="hud-card">
            <div class="card-specular-glare" id="specular-glare"></div>
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <div class="top-telemetry">
                <div><span class="status-dot"></span>SYS_READY</div>
                <div id="target-display">TARGET: ALL</div>
            </div>

            <div class="camera-3d-rig" id="camera-rig">
                <div class="rig-ring-outer"></div>
                <div class="rig-ring-inner"></div>
                <div class="rig-body-cube">
                    <div class="laser-beam-3d"></div>
                    <div class="rig-lens-barrel"></div>
                    <span class="rig-icon">📸</span>
                </div>
            </div>

            <h1 style="margin-bottom: 16px;">PULSE SCANNER</h1>

            <div class="mode-toggle-container">
                <button class="toggle-btn active" id="btn-flow" onclick="selectMode('FLOW')">
                    🌊 Поток
                </button>
                <button class="toggle-btn" id="btn-my" onclick="selectMode('MY_GROUP')">
                    👥 Моя группа
                </button>
            </div>

            <button class="cyber-btn" onclick="startScanner()">
                <svg viewBox="0 0 24 24">
                    <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
                </svg>
                <span>Включить сканер</span>
            </button>
        </div>
    </div>

    
    <!-- Вкладка: РАСПИСАНИЕ -->
    <div id="schedule-view-container">
        <div class="sched-topbar">
            <!-- Выбор группы через всплывающую плашку -->
            <div class="sched-group-picker" id="sched-group-picker">
                <button class="group-selector-btn" onclick="openGroupModal()" title="Сменить учебную группу">
                    <div class="group-selector-left">
                        <span class="group-selector-name" id="current-group-label">УИБО-01-24</span>
                    </div>
                    <span class="group-selector-arrow">Выбрать ▾</span>
                </button>
            </div>

            <!-- Управление неделями со стрелками и свайпом -->
            <div class="sched-controls-row">
                <div class="week-stepper">
                    <button class="week-step-btn" onclick="changeWeek(-1)" title="Предыдущая неделя">❮</button>
                    <div id="sched-week-label" class="sched-week-title">7 неделя</div>
                    <button class="week-step-btn" onclick="changeWeek(1)" title="Следующая неделя">❯</button>
                </div>
                <button class="btn-today-reset" id="btn-today-reset" onclick="resetToCurrentWeek()" style="display:none;">🎯 Сегодня</button>
            </div>

            <!-- Календарная полоска дней с числами месяца -->
            <div class="days-bar" id="days-bar">
                <!-- Генерируется динамически с датами -->
            </div>
        </div>

        <div class="sched-list" id="sched-list">
            <!-- Динамические карточки пар -->
        </div>
    </div>

    <!-- Всплывающая плашка выбора группы (Bottom Sheet Modal) -->
    <div class="group-modal-backdrop" id="group-modal-backdrop" onclick="closeGroupModal(event)">
        <div class="group-modal-sheet" onclick="event.stopPropagation()">
            <div class="group-modal-handle"></div>
            <div class="group-modal-header">
                <div class="group-modal-title">Выбор группы</div>
                <button class="group-modal-close" onclick="closeGroupModal()">✕</button>

            <div class="group-modal-list" id="group-modal-list">
                <button class="group-modal-item" onclick="selectSchedGroup('УИБО-01-24')">
                    <span>УИБО-01-24</span>
                    <span class="group-modal-item-check">✓</span>
                </button>
                <button class="group-modal-item" onclick="selectSchedGroup('УИБО-02-24')">
                    <span>УИБО-02-24</span>
                    <span class="group-modal-item-check">✓</span>
                </button>
                <button class="group-modal-item" onclick="selectSchedGroup('УИБО-03-24')">
                    <span>УИБО-03-24</span>
                    <span class="group-modal-item-check">✓</span>
                </button>
                <button class="group-modal-item" onclick="selectSchedGroup('УИБО-04-24')">
                    <span>УИБО-04-24</span>
                    <span class="group-modal-item-check">✓</span>
                </button>
            </div>

    <!-- Вкладка 2: КАРТА КОРПУСОВ -->
    <div id="map-view-container">
        <div class="map-topbar">
            <div class="campus-picker">
                <button class="campus-btn active" id="btn-campus-v78" onclick="selectCampus('v78')">

    <!-- Вкладка 4: СТАТУС АККАУНТОВ И СКУД -->
    <div id="status-view-container">
        <div class="hud-scene" style="margin-bottom:0;">
            <div class="hud-card">
                <div class="card-specular-glare"></div>
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>

                <div class="top-telemetry">
                    <div><span class="status-dot"></span>SYS_SECURE</div>
                    <div id="status-target-display">TARGET: FLOW</div>
                </div>

                <div class="status-icon-ring">
                    <span style="font-size:36px; filter: drop-shadow(0 0 10px #38bdf8);">🩺</span>
                </div>

                <h1 style="font-size: 20px; margin-bottom: 16px;">ПРОВЕРКА ТУРНИКЕТОВ</h1>

                <!-- Выбор области проверки -->
                <div class="mode-toggle-container">
                    <button class="toggle-btn active" id="btn-status-flow" onclick="selectStatusMode('FLOW')">
                        🌊 Поток
                    </button>
                    <button class="toggle-btn" id="btn-status-group" onclick="selectStatusMode('MY_GROUP')">
                        👥 Моя группа
                    </button>
                </div>

                <!-- Главная кнопка проверки -->
                <button class="cyber-btn" id="btn-run-check" onclick="startStatusCheck()">
                    <span style="font-size:18px;">🩺</span>
                    <span>Запустить</span>
                </button>


            </div>
        </div>
    </div>

    <!-- НАВИГАЦИОННЫЙ ТАБ-БАР (Скроллируемый по 2 кнопки со стрелками) -->
    <div class="bottom-nav-container">
        <button class="nav-arrow-btn" onclick="scrollNav(-1)" title="Назад">❮</button>
        <nav class="bottom-nav" id="bottom-nav-bar">
            <button class="nav-tab active" id="tab-scanner" onclick="switchTab('scanner')">
                <span class="nav-icon">⚡</span>
                <span class="nav-text">Сканер</span>
            </button>
            <button class="nav-tab" id="tab-sched" onclick="switchTab('sched')">
                <span class="nav-icon">📅</span>
                <span class="nav-text">Пары</span>
            </button>
            <button class="nav-tab" id="tab-map" onclick="switchTab('map')">
                <span class="nav-icon">🗺</span>
                <span class="nav-text">Карта</span>
            </button>
            <button class="nav-tab" id="tab-status" onclick="switchTab('status')">
                <span class="nav-icon">🩺</span>
                <span class="nav-text">Статус</span>
            </button>
        </nav>
        <button class="nav-arrow-btn" onclick="scrollNav(1)" title="Вперед">❯</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) {
                tg.disableVerticalSwipes();
            }
        }

        // ============ ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (СКАНИРОВАНИЕ / КАРТА) ============
        let activeMainTab = 'scanner';
        function switchTab(tab) {
            activeMainTab = tab;
            playSciFiBeep(820, 0.05);
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

            const hudScene = document.getElementById('hud-scene');
            const mapView = document.getElementById('map-view-container');
            const schedView = document.getElementById('schedule-view-container');
            const statusView = document.getElementById('status-view-container');

            const tabScan = document.getElementById('tab-scanner');
            const tabSched = document.getElementById('tab-sched');
            const tabMap = document.getElementById('tab-map');
            const tabStatus = document.getElementById('tab-status');

            // Скрываем все экраны
            hudScene.style.display = 'none';
            mapView.style.display = 'none';
            schedView.style.display = 'none';
            statusView.style.display = 'none';

            tabScan.classList.remove('active');
            tabSched.classList.remove('active');
            tabMap.classList.remove('active');
            tabStatus.classList.remove('active');

            if (tab === 'map') {
                mapView.style.display = 'flex';
                tabMap.classList.add('active');
                tabMap.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                if (!mapInitialized) initMap();
            } else if (tab === 'sched') {
                schedView.style.display = 'flex';
                tabSched.classList.add('active');
                tabSched.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                if (!schedInitialized) initSchedule();
            } else if (tab === 'status') {
                statusView.style.display = 'flex';
                tabStatus.classList.add('active');
                tabStatus.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                updateStatusUI();
            } else {
                hudScene.style.display = 'block';
                tabScan.classList.add('active');
                tabScan.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function scrollNav(dir) {
            const bar = document.getElementById('bottom-nav-bar');
            if (bar) {
                playSciFiBeep(700, 0.04);
                if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
                bar.scrollBy({ left: dir * 130, behavior: 'smooth' });
            }
        }


        // ============ МОДУЛЬ СТАТУСА АККАУНТОВ И СКУД ============
        let currentStatusMode = localStorage.getItem('status_check_mode') || 'FLOW';

        function updateStatusUI() {
            const display = document.getElementById('status-target-display');
            const btnFlow = document.getElementById('btn-status-flow');
            const btnGroup = document.getElementById('btn-status-group');

            if (btnFlow) btnFlow.classList.toggle('active', currentStatusMode === 'FLOW');
            if (btnGroup) btnGroup.classList.toggle('active', currentStatusMode === 'MY_GROUP');

            if (display) {
                display.innerText = (currentStatusMode === 'MY_GROUP') ? 'TARGET: GROUP' : 'TARGET: FLOW';
            }
        }

        function selectStatusMode(mode) {
            currentStatusMode = mode;
            localStorage.setItem('status_check_mode', mode);
            playSciFiBeep(750, 0.06);
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            updateStatusUI();
        }

        function startStatusCheck() {
            playSciFiBeep(920, 0.1);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const btn = document.getElementById('btn-run-check');
            if (btn) {
                btn.innerHTML = '<span>⏳ Запрос отправлен боту...</span>';
                btn.style.opacity = '0.7';
            }

            if (tg?.sendData) {
                const payload = JSON.stringify({
                    action: 'check_status',
                    scope: currentStatusMode
                });
                tg.sendData(payload);
                tg.close();
            } else {
                alert('Проверка статуса запускается внутри Telegram. Запрос отправлен боту.');
                if (btn) {
                    btn.innerHTML = '<span style="font-size:18px;">🩺</span><span>Запустить</span>';
                    btn.style.opacity = '1';
                }
            }
        }

        // =========================================================================
        // ============ ДВИЖОК РАСПИСАНИЯ С ПЕРЕХОДОМ НА КАРТУ ====================
        // =========================================================================
        let schedInitialized = false;
        let currentGroup = localStorage.getItem('selected_sched_group') || 'УИБО-01-24';
        let currentDayIdx = (new Date().getDay() + 6) % 7; // 0=ПН .. 6=ВС
        if (currentDayIdx === 6) currentDayIdx = 0; // Воскресенье -> ПН

        // Расчет текущей недели семестра (старт 31 авг 2026)
        const semStart = new Date(2026, 7, 31);
        const nowMs = Date.now();
        const curWeekNum = Math.max(1, Math.floor((nowMs - semStart.getTime()) / (7 * 24 * 3600 * 1000)) + 1);
        
        // Активный номер недели (можно листать от 1 до 18)
        let activeWeekNumber = curWeekNum;

        function getActiveWeekNum() {
            return activeWeekNumber;
        }

        function getActiveParity() {
            return (activeWeekNumber % 2 === 1) ? 'odd' : 'even';
        }

        function changeWeek(delta) {
            const newW = activeWeekNumber + delta;
            if (newW < 1 || newW > 18) return;
            activeWeekNumber = newW;
            playSciFiBeep(780, 0.05);
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            updateWeekUI();
            updateDayTabs();
            renderSchedule();
        }

        function resetToCurrentWeek() {
            activeWeekNumber = curWeekNum;
            const now = new Date();
            currentDayIdx = (now.getDay() + 6) % 7;
            if (currentDayIdx === 6) currentDayIdx = 0;
            playSciFiBeep(880, 0.08);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            updateWeekUI();
            updateDayTabs();
            renderSchedule();
        }

        function initSchedule() {
            schedInitialized = true;
            updateGroupSelectorUI();
            updateWeekUI();
            updateDayTabs();
            setupScheduleSwipe();
            renderSchedule();
            // Фикс: добавляем touchend обработчик на кнопку "Сегодня"
            // чтобы она срабатывала с первого тапа в Telegram WebApp
            const btnToday = document.getElementById('btn-today-reset');
            if (btnToday) {
                btnToday.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    resetToCurrentWeek();
                }, { passive: false });
            }
        }

        function openGroupModal() {
            playSciFiBeep(820, 0.05);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            const modal = document.getElementById('group-modal-backdrop');
            if (modal) modal.classList.add('open');
            updateGroupModalUI();
        }

        function closeGroupModal(e) {
            if (e && e.target && e.target.closest('.group-modal-sheet') && !e.target.classList.contains('group-modal-close')) return;
            const modal = document.getElementById('group-modal-backdrop');
            if (modal) modal.classList.remove('open');
        }

        function selectSchedGroup(grp) {
            currentGroup = grp;
            localStorage.setItem('selected_sched_group', grp);
            playSciFiBeep(880, 0.06);
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            closeGroupModal();
            updateGroupSelectorUI();
            renderSchedule();
        }

        function updateGroupSelectorUI() {
            const lbl = document.getElementById('current-group-label');
            if (lbl) lbl.innerText = currentGroup;
            updateGroupModalUI();
        }

        function updateGroupModalUI() {
            document.querySelectorAll('.group-modal-item').forEach(item => {
                const text = item.querySelector('span')?.innerText?.trim();
                item.classList.toggle('active', text === currentGroup);
            });
        }

        function updateWeekUI() {
            const wNum = activeWeekNumber;
            const parityName = (wNum % 2 === 1) ? 'нечётная' : 'чётная';
            const labelEl = document.getElementById('sched-week-label');
            if (labelEl) {
                labelEl.innerText = `${wNum} неделя (${parityName})`;
            }

            const today = new Date();
            let realTodayDayIdx = (today.getDay() + 6) % 7; // 0=ПН..6=ВС
            if (realTodayDayIdx === 6) realTodayDayIdx = 0; // ВС -> ПН

            const isCurrentToday = (activeWeekNumber === curWeekNum && currentDayIdx === realTodayDayIdx);
            const btnToday = document.getElementById('btn-today-reset');
            if (btnToday) {
                btnToday.style.display = isCurrentToday ? 'none' : 'inline-block';
            }
        }

        // ============ АККУРАТНЫЙ СВАЙП НЕДЕЛЬ ВЛЕВО / ВПРАВО (СТРОГО ПО ПОЛОСКЕ ДАТ) ============
        function setupScheduleSwipe() {
            // Зона свайпа — СТРОГО полоска дат (days-bar)
            // По списку пар (sched-list) и по шапке выбора групп свайпов НЕТ
            const daysBar = document.getElementById('days-bar');
            if (!daysBar) return;

            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;

            daysBar.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isSwiping = false;
                }
            }, { passive: true });

            daysBar.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    const diffX = e.touches[0].clientX - touchStartX;
                    const diffY = e.touches[0].clientY - touchStartY;
                    if (Math.abs(diffX) > 25 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
                        isSwiping = true;
                    }
                }
            }, { passive: true });

            daysBar.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) {
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    const diffX = touchEndX - touchStartX;
                    const diffY = touchEndY - touchStartY;

                    // Если был горизонтальный свайп по полоске дат — переключаем неделю
                    if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
                        if (diffX < 0) {
                            changeWeek(1);  // Свайп влево -> Следующая неделя
                        } else {
                            changeWeek(-1); // Свайп вправо -> Предыдущая неделя
                        }
                    }
                }
            }, { passive: true });

            // Блокируем клик по дню, если палец свайпал полоску дат
            daysBar.addEventListener('click', (e) => {
                if (isSwiping) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    isSwiping = false;
                }
            }, true);
        }

        function setDay(dayIdx) {
            currentDayIdx = dayIdx;
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            updateWeekUI();
            updateDayTabs();
            renderSchedule();
        }

        // Вычисление дат с ПН по СБ для выбранной недели (текущей или следующей)
        function updateDayTabs() {
            const daysBar = document.getElementById('days-bar');
            if (!daysBar) return;
            daysBar.innerHTML = '';

            const dayNames = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
            const today = new Date();
            const realTodayDayIdx = (today.getDay() + 6) % 7; // 0=ПН..6=ВС

            // Находим дату понедельника для выбранного номера недели
            const monday = new Date(semStart);
            monday.setDate(semStart.getDate() + (activeWeekNumber - 1) * 7);

            for (let i = 0; i < 6; i++) {
                const dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + i);
                const dayNumber = dayDate.getDate();

                const isToday = (activeWeekNumber === curWeekNum && i === realTodayDayIdx);
                const isActive = (i === currentDayIdx);

                const btn = document.createElement('button');
                btn.className = 'day-tab' + (isActive ? ' active' : '');
                btn.onclick = () => setDay(i);

                btn.innerHTML = `
                    <span class="day-tab-name">${dayNames[i]}</span>
                    <span class="day-tab-num">${dayNumber}</span>
                    ${isToday ? '<span class="day-today-dot"></span>' : '<span style="height:4px;"></span>'}
                `;

                daysBar.appendChild(btn);
            }
        }

        function renderSchedule() {
            const list = document.getElementById('sched-list');
            list.innerHTML = '';

            const allLessons = window.MIREA_SCHEDULE?.[currentGroup] || [];
            const activeParity = getActiveParity();
            // Фильтр по выбранному дню и четности активной недели (текущая/следующая)
            const filtered = allLessons.filter(l => l.day === currentDayIdx && (l.parity === activeParity || l.parity === 'all'));

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-sched-msg">✨ В этот день пар нет, можно отдохнуть!</div>';
                return;
            }

            // Функция парсинга времени "10:30" в минуты от начала суток
            function timeToMinutes(str) {
                if (!str) return 0;
                const [h, m] = str.split(':').map(Number);
                return h * 60 + m;
            }

            // Текущее реальное время устройства
            const now = new Date();
            const todayDayIdx = (now.getDay() + 6) % 7;
            const nowMinutes = now.getHours() * 60 + now.getMinutes();
            // Подсветка активна только если выбран СЕГОДНЯШНИЙ день на ТЕКУЩЕЙ неделе
            const isTodayActive = (activeWeekNumber === curWeekNum && currentDayIdx === todayDayIdx);

            // Расчет точной даты для выбранного дня и недели
            const semStart = new Date(2026, 7, 31);
            const cardDate = new Date(semStart);
            cardDate.setDate(semStart.getDate() + (activeWeekNumber - 1) * 7 + currentDayIdx);
            const yStr = cardDate.getFullYear();
            const mStr = String(cardDate.getMonth() + 1).padStart(2, '0');
            const dStr = String(cardDate.getDate()).padStart(2, '0');
            const dateIso = `${yStr}-${mStr}-${dStr}`;

            filtered.forEach((lesson, idx) => {
                const [tStartStr, tEndStr] = (lesson.time || '').split('-').map(s => s.trim());
                const lStartMin = timeToMinutes(tStartStr);
                const lEndMin = timeToMinutes(tEndStr);

                // Если это не первая пара — проверяем перерыв с предыдущей парой
                if (idx > 0) {
                    const prevLesson = filtered[idx - 1];
                    const prevEndStr = (prevLesson.time || '').split('-')[1]?.trim();
                    const prevEndMin = timeToMinutes(prevEndStr);

                    if (prevEndMin && lStartMin) {
                        const diffMin = lStartMin - prevEndMin;
                        if (diffMin > 0) {
                            const isBreakNow = isTodayActive && (nowMinutes >= prevEndMin && nowMinutes < lStartMin);

                            const breakDiv = document.createElement('div');
                            breakDiv.className = 'lesson-break-divider';
                            const isLong = diffMin >= 30;
                            let badgeCls = isLong ? 'lesson-break-badge break-long' : 'lesson-break-badge';
                            if (isBreakNow) badgeCls += ' is-current-break';

                            const icon = isBreakNow ? '🟢' : (isLong ? '☕' : '⏱');

                            let breakText = '';
                            if (diffMin >= 60) {
                                const hrs = Math.floor(diffMin / 60);
                                const mins = diffMin % 60;
                                breakText = `Окно ${hrs} ч ${mins > 0 ? mins + ' мин' : ''}`;
                            } else {
                                breakText = `Перерыв ${diffMin} мин`;
                            }

                            if (isBreakNow) {
                                const breakLeftMin = lStartMin - nowMinutes;
                                breakText = `⏱ Перерыв · до пары ${formatMinutes(breakLeftMin)}`;
                            }

                            breakDiv.innerHTML = `
                                <div class="lesson-break-line"></div>
                                <div class="${badgeCls}">
                                    <span>${icon}</span>
                                    <span>${breakText}</span>
                                </div>
                                <div class="lesson-break-line"></div>
                            `;
                            list.appendChild(breakDiv);
                        }
                    }
                }

                // Проверяем, идет ли эта пара прямо сейчас
                const isLessonNow = isTodayActive && (nowMinutes >= lStartMin && nowMinutes < lEndMin);
                const lessonLeftMin = isLessonNow ? (lEndMin - nowMinutes) : 0;

                const card = document.createElement('div');
                card.className = isLessonNow ? 'lesson-card is-current-now' : 'lesson-card';

                let badgeCls = 'badge-pr';
                const t = (lesson.type || '').toUpperCase();
                if (t === 'ЛК') badgeCls = 'badge-lk';
                else if (t === 'ЛАБ') badgeCls = 'badge-lab';
                else if (t === 'СР') badgeCls = 'badge-sr';

                const teacherEscaped = (lesson.teacher || '').replace(/'/g, "\\'");
                const teacherHtml = lesson.teacher 
                    ? `<span class="lesson-teacher" onclick="showTeacherToast('${teacherEscaped}')" title="Показать ФИО целиком">👤 ${lesson.teacher}</span>` 
                    : '<span></span>';

                let roomBtnHtml = '';
                const rLower = (lesson.room || '').toLowerCase();
                const tLower = (lesson.title || '').toLowerCase();
                const isMilitaryOrDept = rLower.includes('кафедра') || rLower.includes('вуц') || rLower.includes('у-7') || tLower.includes('военн');

                if (lesson.room && !isMilitaryOrDept) {
                    roomBtnHtml = `
                        <button class="room-tag-btn" onclick="goToRoomOnMap('${lesson.room}', '${lesson.campus}')">
                            <span class="room-icon">📍</span>

        function goToRoomOnMap(roomCode, campusHint) {
            playSciFiBeep(940, 0.08);
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            // 1. Переключаем на таб карты
            switchTab('map');

            // 2. Выбираем правильный корпус
            const campus = (campusHint === 'mp1' || roomCode.includes('МП')) ? 'mp1' : 'v78';
            selectCampus(campus);

            const campusData = window.MIREA_MAPS?.[campus] || {};
            const cleanTarget = roomCode.trim().toLowerCase();
            const normTarget = cleanTarget.replace(/[^a-zа-я0-9]/g, '');

            let found = null;

            // Этап 1: СТРОГОЕ точное совпадение (например, "А-17" === "А-17", а не "А-173")
            for (const [flNum, flData] of Object.entries(campusData)) {
                const verts = flData.v || {};
                for (const a of (flData.a || [])) {
                    const name = (a.n || '').trim().toLowerCase();
                    if (name === cleanTarget) {
                        const pts = (a.v || []).map(vid => verts[vid]).filter(Boolean);
                        if (pts.length >= 3) {
                            const cx = pts.reduce((sum, p) => sum + p[0], 0) / pts.length;
                            const cy = pts.reduce((sum, p) => sum + p[1], 0) / pts.length;
                            found = { floor: flNum, cx, cy, pts, area: a };
                            break;
                        }
                    }
                }
                if (found) break;
            }

            // Этап 2: Нормализованное точное совпадение (игнорируя тире и пробелы)
            if (!found) {
                for (const [flNum, flData] of Object.entries(campusData)) {
                    const verts = flData.v || {};
                    for (const a of (flData.a || [])) {
                        const name = (a.n || '').trim().toLowerCase();
                        const normName = name.replace(/[^a-zа-я0-9]/g, '');
                        if (normName === normTarget) {
                            const pts = (a.v || []).map(vid => verts[vid]).filter(Boolean);
                            if (pts.length >= 3) {
                                const cx = pts.reduce((sum, p) => sum + p[0], 0) / pts.length;
                                const cy = pts.reduce((sum, p) => sum + p[1], 0) / pts.length;
                                found = { floor: flNum, cx, cy, pts, area: a };
                                break;
                            }
                        }
                    }
                    if (found) break;
                }
            }

            // Этап 3: Точное совпадение как отдельного токена в списке (например "ИВЦ-105, ИВЦ-105.1")
            if (!found) {
                for (const [flNum, flData] of Object.entries(campusData)) {
                    const verts = flData.v || {};
                    for (const a of (flData.a || [])) {
                        const name = (a.n || '').trim().toLowerCase();
                        const tokens = name.split(/[,;/ ]+/).map(t => t.trim());
                        if (tokens.includes(cleanTarget)) {
                            const pts = (a.v || []).map(vid => verts[vid]).filter(Boolean);
                            if (pts.length >= 3) {
                                const cx = pts.reduce((sum, p) => sum + p[0], 0) / pts.length;
                                const cy = pts.reduce((sum, p) => sum + p[1], 0) / pts.length;
                                found = { floor: flNum, cx, cy, pts, area: a };
                                break;
                            }
                        }
                    }
                    if (found) break;
                }
            }

            if (found) {
                // Переключаем этаж
                if (currentFloor !== found.floor) {
                    selectFloor(found.floor);
                }
                // Фокусируем камеру и подсвечиваем точный кабинет
                setTimeout(() => {
                    focusOnCoords(found.cx, found.cy);
                    showRoomDetails(found.area, found.pts);
                }, 120);
            } else {
                // Если номера нет в геометрии (например военная кафедра) — заносим в поиск
                searchInput.value = roomCode;
                searchInput.dispatchEvent(new Event('input'));
            }
        }

        function playSciFiBeep(freq = 880, duration = 0.08) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 2, ctx.currentTime + duration);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        // ============ КИБЕР-ФОН (СЕТКА + ЧАСТИЦЫ) ============
        const canvas = document.getElementById('cyber-canvas');
