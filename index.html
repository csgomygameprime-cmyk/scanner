<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ PULSE CYBER SCANNER</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --neon-purple: #c084fc;
            --neon-violet: #9333ea;
            --neon-pink: #f43f5e;
            --neon-cyan: #38bdf8;
            --bg-dark: #060212;
            --card-bg: rgba(18, 10, 36, 0.85);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(147, 51, 234, 0.45) 0%, transparent 65%),
                radial-gradient(circle at 80% 90%, rgba(244, 63, 94, 0.18) 0%, transparent 50%),
                linear-gradient(rgba(147, 51, 234, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(147, 51, 234, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 16px 85px 16px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow-1 {
            position: fixed;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(124, 58, 237, 0) 70%);
            filter: blur(65px);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow 6s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -50px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(147, 51, 234, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.7; }
            100% { transform: scale(1.15) translate(15px, 15px); opacity: 1; }
        }

        .hud-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 28px;
            padding: 24px 20px;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.9),
                0 0 45px rgba(147, 51, 234, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--neon-purple);
            pointer-events: none;
        }
        .corner-tl { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-tr { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }

        .top-telemetry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(216, 180, 254, 0.85);
            font-family: monospace;
            margin-bottom: 12px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            margin-right: 6px;
            animation: blink 1.2s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.25s ease-in-out;
        }

        .tab-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-3d-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 6px 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 600px;
        }

        .hero-3d-cube {
            position: relative;
            width: 78px;
            height: 78px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(99, 102, 241, 0.15) 100%);
            border: 1px solid rgba(216, 180, 254, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 15px 35px rgba(124, 58, 237, 0.45), inset 0 0 20px rgba(192, 132, 252, 0.3);
            animation: float-3d 4s ease-in-out infinite alternate;
        }

        .laser-beam {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff, var(--neon-purple), var(--neon-pink), transparent);
            box-shadow: 0 0 12px var(--neon-purple), 0 0 20px var(--neon-pink);
            animation: laser-sweep 2s ease-in-out infinite alternate;
        }

        @keyframes laser-sweep {
            0% { top: 12%; opacity: 0.3; }
            100% { top: 88%; opacity: 1; }
        }

        @keyframes float-3d {
            0% { transform: translateY(-4px) rotateX(8deg); }
            100% { transform: translateY(6px) rotateX(-8deg); }
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: #d8b4fe;
            opacity: 0.85;
            margin-bottom: 14px;
        }

        .mode-toggle-container {
            display: flex;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 11px 8px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #d8b4fe;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(147, 51, 234, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
        }

        .cyber-btn {
            position: relative;
            width: 100%;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.55), 0 0 22px rgba(168, 85, 247, 0.35);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-btn:active {
            transform: scale(0.96);
        }

        .cyber-input-group {
            width: 100%;
            margin-bottom: 12px;
            text-align: left;
        }

        .cyber-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d8b4fe;
            margin-bottom: 4px;
            display: block;
        }

        .cyber-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .cyber-input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .acc-list {
            width: 100%;
            max-height: 270px;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .acc-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        .acc-info-email {
            font-size: 12.5px;
            font-weight: 600;
            color: #ffffff;
            word-break: break-all;
        }

        .acc-info-sub {
            font-size: 11px;
            color: #d8b4fe;
            opacity: 0.8;
            margin-top: 2px;
        }

        .btn-del {
            background: rgba(244, 63, 94, 0.18);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fda4af;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-del:active {
            transform: scale(0.92);
            background: rgba(244, 63, 94, 0.4);
        }

        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 380px;
            background: rgba(18, 10, 36, 0.9);
            border: 1px solid rgba(192, 132, 252, 0.35);
            border-radius: 22px;
            padding: 6px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 16px;
            cursor: pointer;
            color: #d8b4fe;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s ease;
            gap: 3px;
        }

        .nav-item.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.4) 0%, rgba(99, 102, 241, 0.25) 100%);
            border: 1px solid rgba(192, 132, 252, 0.3);
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
        }

        .nav-icon {
            font-size: 17px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="hud-card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="top-telemetry">
            <div><span class="status-dot"></span>SYS_READY</div>
            <div id="target-display">TARGET: ALL</div>
        </div>

        <!-- ВКЛАДКА 1: СКАНЕР QR -->
        <div class="tab-content active" id="tab-scan">
            <div class="hero-3d-wrapper">
                <div class="hero-3d-cube">
                    <div class="laser-beam"></div>
                    <span>📸</span>
                </div>
            </div>

            <h1>Fast QR Scanner</h1>
            <p class="subtitle">Параллельный залп по сокетам (&lt;0.1s)</p>

            <div class="mode-toggle-container">
                <button class="toggle-btn active" id="btn-all" onclick="selectTargetMode('ALL')">
                    ⚡ Все
                </button>
                <button class="toggle-btn" id="btn-my" onclick="selectTargetMode('MY_GROUP')">
                    👥 Моя группа
                </button>
            </div>

            <button class="cyber-btn" onclick="startScanner()">
                <span>⚡ Сканировать QR</span>
            </button>
        </div>

        <!-- ВКЛАДКА 2: ДОБАВИТЬ / УПРАВЛЕНИЕ -->
        <div class="tab-content" id="tab-manage">
            <h1 style="margin-top: 8px;">Добавить аккаунт</h1>
            <p class="subtitle">Привязка личного аккаунта</p>

            <div class="cyber-input-group">
                <label class="cyber-label">Почта (edu.mirea.ru)</label>
                <input type="email" id="input-email" class="cyber-input" placeholder="ivanov.i.i@edu.mirea.ru">
            </div>

            <div class="cyber-input-group">
                <label class="cyber-label">Пароль</label>
                <input type="password" id="input-pass" class="cyber-input" placeholder="••••••••••••">
            </div>

            <button class="cyber-btn" style="margin-bottom: 16px;" onclick="submitNewAccount()">
                <span>🔑 Войти и сохранить</span>
            </button>

            <div class="top-telemetry" style="margin-top: 6px; margin-bottom: 4px;">
                <div>МОИ АККАУНТЫ</div>
                <div id="my-acc-count">0 шт.</div>
            </div>

            <div class="acc-list" id="my-accounts-list">
                <!-- Заполняется динамически -->
            </div>
        </div>

        <!-- ВКЛАДКА 3: ВСЕ АККАУНТЫ -->
        <div class="tab-content" id="tab-all-accs">
            <h1 style="margin-top: 8px;">Все аккаунты</h1>
            <p class="subtitle">База данных системы</p>

            <div class="top-telemetry" style="margin-bottom: 4px;">
                <div>ВСЕГО В СИСТЕМЕ</div>
                <div id="all-acc-count">0 шт.</div>
            </div>

            <div class="acc-list" id="all-accounts-list">
                <!-- Заполняется динамически -->
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИОННАЯ ПАНЕЛЬ -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-btn-scan" onclick="switchTab('tab-scan', this)">
            <span class="nav-icon">⚡</span>
            <span>Сканер</span>
        </div>
        <div class="nav-item" id="nav-btn-manage" onclick="switchTab('tab-manage', this)">
            <span class="nav-icon">➕</span>
            <span>Управление</span>
        </div>
        <div class="nav-item" id="nav-btn-all" onclick="switchTab('tab-all-accs', this)">
            <span class="nav-icon">👥</span>
            <span>Все аккаунты</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const ADMIN_ID = 1828262091;
        const currentUserId = tg?.initDataUnsafe?.user?.id || 0;

        let currentTargetMode = localStorage.getItem('qr_target_mode') || 'ALL';

        function playSciFiBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function switchTab(tabId, el) {
            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function selectTargetMode(mode) {
            currentTargetMode = mode;
            localStorage.setItem('qr_target_mode', mode);
            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
            updateTargetUI();
        }

        function updateTargetUI() {
            const display = document.getElementById('target-display');
            const btnAll = document.getElementById('btn-all');
            const btnMy = document.getElementById('btn-my');

            if (currentTargetMode === 'MY_GROUP') {
                display.innerText = 'TARGET: MY GROUP';
                btnAll.classList.remove('active');
                btnMy.classList.add('active');
            } else {
                display.innerText = 'TARGET: ALL';
                btnMy.classList.remove('active');
                btnAll.classList.add('active');
            }
        }

        function startScanner() {
            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (tg?.showScanQrPopup) {
                const targetText = currentTargetMode === 'ALL' ? 'всех аккаунтов' : 'моей группы';
                tg.showScanQrPopup({ text: `⚡ Отметка для: ${targetText}` }, function(text) {
                    if (text) {
                        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        
                        const payload = JSON.stringify({
                            action: "scan_qr",
                            url: text.trim(),
                            group: currentTargetMode
                        });
                        tg.sendData(payload);
                        tg.close();
                        return true;
                    }
                });
            } else {
                alert("Сканер доступен через мобильное приложение Telegram");
            }
        }

        function submitNewAccount() {
            const email = document.getElementById('input-email').value.trim();
            const pass = document.getElementById('input-pass').value.trim();

            if (!email || !pass) {
                alert("Заполните почту и пароль!");
                return;
            }

            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');

            const payload = JSON.stringify({
                action: "add_account",
                email: email,
                password: pass
            });

            tg.sendData(payload);
            tg.close();
        }

        function deleteAccount(email) {
            if (!confirm(`Удалить аккаунт ${email}?`)) return;

            playSciFiBeep();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');

            const payload = JSON.stringify({
                action: "delete_account",
                email: email
            });

            tg.sendData(payload);
            tg.close();
        }

        window.onload = () => {
            updateTargetUI();
        };
    </script>
</body>
</html>
