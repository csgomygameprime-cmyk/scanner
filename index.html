<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ PULSE CYBER SCANNER</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --neon-purple: #c084fc;
            --neon-violet: #9333ea;
            --neon-pink: #f43f5e;
            --neon-cyan: #38bdf8;
            --neon-green: #22c55e;
            --bg-dark: #060212;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            perspective: 1100px;
        }

        /* 60 FPS Фоновый Canvas (Сетка + Частицы) */
        #cyber-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Неоновые светящиеся сферы */
        .ambient-glow-1 {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(124, 58, 237, 0) 70%);
            filter: blur(65px);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow 5s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -50px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(147, 51, 234, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.5; }
            100% { transform: scale(1.15) translate(15px, 15px); opacity: 0.85; }
        }

        /* 3D Сцена */
        .hud-scene {
            width: 100%;
            max-width: 350px;
            z-index: 1;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Главная голографическая карточка */
        .hud-card {
            position: relative;
            width: 100%;
            background: rgba(18, 10, 36, 0.78);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 30px;
            padding: 26px 20px;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.85),
                0 0 40px rgba(147, 51, 234, 0.3),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform-style: preserve-3d;
            overflow: hidden;
        }

        /* Динамический световой блик */
        .card-specular-glare {
            position: absolute;
            inset: 0;
            border-radius: 30px;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.22) 0%, rgba(192, 132, 252, 0.06) 45%, transparent 75%);
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: overlay;
        }

        /* Угловые прицелы */
        .corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--neon-purple);
            pointer-events: none;
            transform: translateZ(15px);
        }
        .corner-tl { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-tr { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }

        .top-telemetry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(216, 180, 254, 0.85);
            font-family: monospace;
            margin-bottom: 10px;
            transform: translateZ(20px);
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            margin-right: 6px;
            animation: blink 1.2s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ============ 3D ОБЪЕМНЫЙ РИГ ФОТОАППАРАТА ============ */
        .camera-3d-rig {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 6px 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            perspective: 800px;
            will-change: transform;
        }

        .rig-ring-outer {
            position: absolute;
            width: 116px;
            height: 116px;
            border-radius: 50%;
            border: 2px dashed rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
            transform: translateZ(10px);
            animation: ring-spin 10s linear infinite;
        }

        .rig-ring-inner {
            position: absolute;
            width: 98px;
            height: 98px;
            border-radius: 50%;
            border: 1.5px solid rgba(244, 63, 94, 0.45);
            transform: translateZ(22px);
            animation: ring-spin-reverse 7s linear infinite;
        }

        @keyframes ring-spin { 100% { transform: translateZ(10px) rotate(360deg); } }
        @keyframes ring-spin-reverse { 100% { transform: translateZ(22px) rotate(-360deg); } }

        .rig-body-cube {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.35) 0%, rgba(99, 102, 241, 0.2) 100%);
            border: 1.5px solid rgba(216, 180, 254, 0.6);
            box-shadow: 
                0 15px 35px rgba(124, 58, 237, 0.5),
                inset 0 0 20px rgba(192, 132, 252, 0.35);
            transform-style: preserve-3d;
            transform: translateZ(30px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .rig-lens-barrel {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.6) 0%, rgba(18, 10, 36, 0.9) 75%);
            border: 2px solid rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.5), inset 0 0 10px rgba(192, 132, 252, 0.8);
            transform: translateZ(42px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rig-icon {
            font-size: 36px;
            transform: translateZ(55px);
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.8)) drop-shadow(0 0 14px rgba(192, 132, 252, 0.9));
            display: inline-block;
            animation: pulse-icon 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulse-icon {
            0% { transform: translateZ(55px) scale(0.96); }
            100% { transform: translateZ(55px) scale(1.06); }
        }

        .laser-beam-3d {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff, var(--neon-purple), var(--neon-pink), transparent);
            box-shadow: 0 0 12px var(--neon-purple), 0 0 20px var(--neon-pink);
            transform: translateZ(35px);
            animation: laser-sweep 2.2s ease-in-out infinite alternate;
        }

        @keyframes laser-sweep {
            0% { top: 12%; opacity: 0.3; }
            100% { top: 88%; opacity: 1; }
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            text-transform: uppercase;
            transform: translateZ(22px);
        }

        .subtitle {
            font-size: 12px;
            color: #d8b4fe;
            opacity: 0.85;
            margin-bottom: 14px;
            transform: translateZ(20px);
        }

        /* Переключатель: Все vs Моя группа */
        .mode-toggle-container {
            display: flex;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 18px;
            gap: 4px;
            transform: translateZ(25px);
            touch-action: manipulation;
        }

        .toggle-btn {
            flex: 1;
            padding: 11px 8px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #d8b4fe;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(147, 51, 234, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
        }

        .toggle-btn:active {
            transform: scale(0.96);
        }

        /* Неоновая кнопка сканера */
        .cyber-btn {
            position: relative;
            width: 100%;
            padding: 15px 18px;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.55), 0 0 22px rgba(168, 85, 247, 0.35);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateZ(30px);
            touch-action: manipulation;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .cyber-btn:active {
            transform: translateZ(20px) scale(0.95);
        }

        .cyber-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Фоновый Canvas: Кибер-сетка и Парящие Частицы -->
    <canvas id="cyber-canvas"></canvas>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="hud-scene" id="hud-scene">
        <div class="hud-card" id="hud-card">
            <div class="card-specular-glare" id="specular-glare"></div>

            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <div class="top-telemetry">
                <div><span class="status-dot"></span>SYS_READY</div>
                <div id="target-display">TARGET: ALL</div>
            </div>

            <!-- Объемный 3D-Риг Камеры -->
            <div class="camera-3d-rig" id="camera-rig">
                <div class="rig-ring-outer"></div>
                <div class="rig-ring-inner"></div>
                
                <div class="rig-body-cube">
                    <div class="laser-beam-3d"></div>
                    <div class="rig-lens-barrel"></div>
                    <span class="rig-icon">📸</span>
                </div>
            </div>

            <h1>Fast QR Scanner</h1>
            <p class="subtitle">Параллельный залп по сокетам (&lt;0.1s)</p>

            <!-- Селектор: Все vs Моя группа -->
            <div class="mode-toggle-container">
                <button class="toggle-btn active" id="btn-all" onclick="selectMode('ALL')">
                    ⚡ Все
                </button>
                <button class="toggle-btn" id="btn-my" onclick="selectMode('MY_GROUP')">
                    👥 Моя группа
                </button>
            </div>

            <!-- Кнопка камеры (Нативный Telegram QR Popup) -->
            <button class="cyber-btn" onclick="startScanner()">
                <svg viewBox="0 0 24 24">
                    <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
                </svg>
                <span>Включить сканер</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.disableVerticalSwipes) {
                tg.disableVerticalSwipes();
            }
        }

        let currentMode = localStorage.getItem('qr_target_mode') || 'ALL';

        // ============ ЗВУКОВОЙ ДВИЖОК ============
        function playSciFiBeep(freq = 880, duration = 0.08) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 2, ctx.currentTime + duration);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function updateUI() {
            const display = document.getElementById('target-display');
            const btnAll = document.getElementById('btn-all');
            const btnMy = document.getElementById('btn-my');

            if (currentMode === 'MY_GROUP') {
                display.innerText = 'TARGET: MY GROUP';
                btnAll.classList.remove('active');
                btnMy.classList.add('active');
            } else {
                display.innerText = 'TARGET: ALL';
                btnMy.classList.remove('active');
                btnAll.classList.add('active');
            }
        }

        function selectMode(mode) {
            currentMode = mode;
            localStorage.setItem('qr_target_mode', mode);
            playSciFiBeep(750, 0.06);
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
            updateUI();
        }

        function startScanner() {
            playSciFiBeep(920, 0.1);
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            if (tg?.showScanQrPopup) {
                const targetText = currentMode === 'ALL' ? 'всех аккаунтов' : 'моей группы';
                tg.showScanQrPopup({ text: `⚡ Отметка для: ${targetText}` }, function(text) {
                    if (text) {
                        if (tg?.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                        const payload = JSON.stringify({
                            url: text.trim(),
                            group: currentMode
                        });
                        tg.sendData(payload);
                        tg.close();
                        return true;
                    }
                });
            } else {
                alert("Сканер запускается через мобильное приложение Telegram");
            }
        }

        // ============ КИБЕР-ФОН (СЕТКА + ЧАСТИЦЫ) ============
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let gridOffset = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        function initParticles() {
            particles = [];
            const count = Math.floor(width < 600 ? 25 : 40);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.8,
                    speedY: Math.random() * 0.35 + 0.15,
                    speedX: (Math.random() - 0.5) * 0.15,
                    alpha: Math.random() * 0.6 + 0.2
                });
            }
        }

        function drawBackground() {
            ctx.clearRect(0, 0, width, height);

            gridOffset = (gridOffset + 0.3) % 40;
            ctx.strokeStyle = 'rgba(147, 51, 234, 0.07)';
            ctx.lineWidth = 1;

            ctx.beginPath();
            for (let x = 0; x <= width; x += 40) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            for (let y = gridOffset; y <= height; y += 40) {
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -10) p.y = height + 10;
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;

                ctx.fillStyle = `rgba(192, 132, 252, ${p.alpha})`;
                ctx.shadowColor = '#c084fc';
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            requestAnimationFrame(drawBackground);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(drawBackground);

        // ============ МГНОВЕННЫЙ 3D-ДВИЖОК С ПАССИВНЫМ ГИРОСКОПОМ ============
        const hudScene = document.getElementById('hud-scene');
        const cameraRig = document.getElementById('camera-rig');
        const glare = document.getElementById('specular-glare');

        let gyroX = 0;
        let gyroY = 0;

        // Пассивный сбор данных наклона без системных запросов разрешений
        window.addEventListener('deviceorientation', (e) => {
            if (e.beta !== null && e.gamma !== null) {
                const deltaBeta = Math.max(-30, Math.min(30, e.beta - 45));
                const deltaGamma = Math.max(-30, Math.min(30, e.gamma));
                gyroX = -deltaBeta * 0.35;
                gyroY = deltaGamma * 0.45;
            }
        }, { passive: true });

        // Автономное 3D вращение + наложение наклона
        function animate3DScene(now) {
            const t = now * 0.001;

            // Базовое парение + наклон
            const cardRotX = Math.sin(t * 1.1) * 5.0 + gyroX;
            const cardRotY = Math.cos(t * 0.85) * 6.5 + gyroY;
            const cardFloatY = Math.sin(t * 1.4) * 5.0;

            hudScene.style.transform = `translateY(${cardFloatY.toFixed(2)}px) rotateX(${cardRotX.toFixed(2)}deg) rotateY(${cardRotY.toFixed(2)}deg)`;

            // 3D-риг фотоаппарата
            const camRotX = Math.sin(t * 1.6) * 12.0 - gyroX * 0.5;
            const camRotY = Math.sin(t * 1.0) * 20.0 + gyroY * 0.5;
            const camRollZ = Math.cos(t * 0.7) * 6.0;

            cameraRig.style.transform = `rotateX(${camRotX.toFixed(2)}deg) rotateY(${camRotY.toFixed(2)}deg) rotateZ(${camRollZ.toFixed(2)}deg)`;

            // Световой блик
            const glareX = 50 + Math.cos(t * 0.85) * 28.0 + gyroY * 1.5;
            const glareY = 50 - Math.sin(t * 1.1) * 28.0 - gyroX * 1.5;
            glare.style.background = `radial-gradient(circle at ${glareX.toFixed(1)}% ${glareY.toFixed(1)}%, rgba(255, 255, 255, 0.28) 0%, rgba(192, 132, 252, 0.06) 45%, transparent 75%)`;

            requestAnimationFrame(animate3DScene);
        }

        requestAnimationFrame(animate3DScene);

        window.onload = () => {
            updateUI();
        };
    </script>
</body>
</html>
