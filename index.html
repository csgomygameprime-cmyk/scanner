<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ PULSE CYBER SCANNER</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --neon-purple: #c084fc;
            --neon-violet: #9333ea;
            --neon-pink: #f43f5e;
            --neon-cyan: #38bdf8;
            --bg-dark: #060212;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(147, 51, 234, 0.45) 0%, transparent 65%),
                radial-gradient(circle at 80% 90%, rgba(244, 63, 94, 0.18) 0%, transparent 50%),
                linear-gradient(rgba(147, 51, 234, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(147, 51, 234, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        /* Неоновые светящиеся сферы */
        .ambient-glow-1 {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.5) 0%, rgba(124, 58, 237, 0) 70%);
            filter: blur(65px);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow 6s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -50px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(147, 51, 234, 0) 70%);
            filter: blur(55px);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.7; }
            100% { transform: scale(1.15) translate(15px, 15px); opacity: 1; }
        }

        /* Главная голографическая карточка */
        .hud-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 360px;
            background: rgba(18, 10, 36, 0.75);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 32px;
            padding: 28px 22px;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.9),
                0 0 45px rgba(147, 51, 234, 0.35),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Угловые прицелы */
        .corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--neon-purple);
            pointer-events: none;
        }
        .corner-tl { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-tr { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }
        .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; filter: drop-shadow(0 0 5px var(--neon-purple)); }

        .top-telemetry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(216, 180, 254, 0.85);
            font-family: monospace;
            margin-bottom: 12px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            margin-right: 6px;
            animation: blink 1.2s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 3D-Элемент сканера */
        .hero-3d-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 6px 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 600px;
        }

        .hero-3d-cube {
            position: relative;
            width: 82px;
            height: 82px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(99, 102, 241, 0.15) 100%);
            border: 1px solid rgba(216, 180, 254, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 
                0 15px 35px rgba(124, 58, 237, 0.45),
                inset 0 0 20px rgba(192, 132, 252, 0.3);
            animation: float-3d 4s ease-in-out infinite alternate;
            transform-style: preserve-3d;
        }

        .hero-3d-cube .emoji-3d {
            display: inline-block;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 14px rgba(192, 132, 252, 0.8));
            animation: pulse-emoji 2.5s ease-in-out infinite alternate;
        }

        /* Вращающееся неоновое кольцо вокруг 3D-иконки */
        .ring-orb {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 2px dashed rgba(56, 189, 248, 0.5);
            animation: rotate-ring 10s linear infinite;
        }

        @keyframes float-3d {
            0% { transform: translateY(-4px) rotateX(10deg) rotateY(-8deg); }
            100% { transform: translateY(6px) rotateX(-8deg) rotateY(10deg); }
        }

        @keyframes pulse-emoji {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.08); }
        }

        @keyframes rotate-ring {
            100% { transform: rotate(360deg); }
        }

        /* Лазерный луч сканера */
        .laser-beam {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff, var(--neon-purple), var(--neon-pink), transparent);
            box-shadow: 0 0 12px var(--neon-purple), 0 0 20px var(--neon-pink);
            animation: laser-sweep 2s ease-in-out infinite alternate;
        }

        @keyframes laser-sweep {
            0% { top: 12%; opacity: 0.3; }
            100% { top: 88%; opacity: 1; }
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12.5px;
            color: #d8b4fe;
            opacity: 0.85;
            margin-bottom: 14px;
        }

        /* Переключатель: Все vs Моя группа */
        .mode-toggle-container {
            display: flex;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 22px;
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px 10px;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #d8b4fe;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(147, 51, 234, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
        }

        .toggle-btn:active {
            transform: scale(0.97);
        }

        /* Неоновая кнопка сканера */
        .cyber-btn {
            position: relative;
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.55), 0 0 22px rgba(168, 85, 247, 0.35);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .cyber-btn:active {
            transform: scale(0.96);
        }

        .cyber-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="hud-card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="top-telemetry">
            <div><span class="status-dot"></span>SYS_READY</div>
            <div id="target-display">TARGET: ALL</div>
        </div>

        <!-- 3D Визуальный блок -->
        <div class="hero-3d-wrapper">
            <div class="ring-orb"></div>
            <div class="hero-3d-cube">
                <div class="laser-beam"></div>
                <span class="emoji-3d">📸</span>
            </div>
        </div>

        <h1>Fast QR Scanner</h1>
        <p class="subtitle">Параллельный залп по сокетам (&lt;0.1s)</p>

        <!-- Селектор: Все vs Моя группа -->
        <div class="mode-toggle-container">
            <button class="toggle-btn active" id="btn-all" onclick="selectMode('ALL')">
                ⚡ Все
            </button>
            <button class="toggle-btn" id="btn-my" onclick="selectMode('MY_GROUP')">
                👥 Моя группа
            </button>
        </div>

        <!-- Кнопка камеры -->
        <button class="cyber-btn" onclick="startScanner()">
            <svg viewBox="0 0 24 24">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
            </svg>
            <span>Включить сканер</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let currentMode = localStorage.getItem('qr_target_mode') || 'ALL';

        // Синтезированный короткий аудио-бип при нажатии (0 КБ)
        function playSciFiBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function updateUI() {
            const display = document.getElementById('target-display');
            const btnAll = document.getElementById('btn-all');
            const btnMy = document.getElementById('btn-my');

            if (currentMode === 'MY_GROUP') {
                display.innerText = 'TARGET: MY GROUP';
                btnAll.classList.remove('active');
                btnMy.classList.add('active');
            } else {
                display.innerText = 'TARGET: ALL';
                btnMy.classList.remove('active');
                btnAll.classList.add('active');
            }
        }

        function selectMode(mode) {
            currentMode = mode;
            localStorage.setItem('qr_target_mode', mode);
            playSciFiBeep();
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            updateUI();
        }

        function startScanner() {
            playSciFiBeep();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (tg.showScanQrPopup) {
                const targetText = currentMode === 'ALL' ? 'всех аккаунтов' : 'моей группы';
                tg.showScanQrPopup({ text: `⚡ Отметка для: ${targetText}` }, function(text) {
                    if (text) {
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        
                        const payload = JSON.stringify({
                            url: text.trim(),
                            group: currentMode
                        });
                        tg.sendData(payload);
                        tg.close();
                        return true;
                    }
                });
            } else {
                alert("Сканер запускается через мобильное приложение Telegram");
            }
        }

        window.onload = () => {
            updateUI();
        };
    </script>
</body>
</html>
